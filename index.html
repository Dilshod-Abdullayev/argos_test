<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davlat xizmati testi — Yodlash va Test</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14213d; --muted:#5b6478; --line:#e3e7ef;
  --pri:#1f4fd1; --pri-2:#e8eefc; --ok:#16a34a; --ok-2:#e7f7ec; --bad:#dc2626; --bad-2:#fdecec;
  --warn:#d97706; --warn-2:#fff4e0; --shadow:0 6px 24px rgba(20,33,61,.08); --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.25}
.back{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.hero{background:linear-gradient(135deg,#1f4fd1,#3b2fc9);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.9;font-size:14.5px}
.hero .cd{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);padding:8px 12px;border-radius:12px;font-weight:600;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.big{display:block;text-align:left;width:100%;padding:22px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;transition:.15s}
.big:hover{border-color:var(--pri)}
.big .ic{font-size:34px}
.big h2{margin:6px 0 4px;font-size:21px}
.big p{margin:0;color:var(--muted);font-size:14.5px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.bar.pri>i{background:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.sec-t{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.chip small{opacity:.7;font-weight:500;margin-left:4px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:620px){.tools{grid-template-columns:1fr}}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none}
.search:focus{border-color:var(--pri)}
.qnum{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.b-cat{background:var(--pri-2);color:var(--pri)}
.b-o{background:var(--warn-2);color:var(--warn)}
.b-p{background:var(--bad-2);color:var(--bad)}
.b-k{background:var(--ok-2);color:var(--ok)}
.b-a{background:var(--bad-2);color:var(--bad)}
.qtext{font-size:18.5px;font-weight:650;line-height:1.45;margin:6px 0 14px}
@media(max-width:620px){.qtext{font-size:17px}}
.ans{background:var(--ok-2);border-left:4px solid var(--ok);border-radius:12px;padding:14px 14px}
.ans .lbl{font-size:12.5px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.ans .t{font-size:17.5px;font-weight:700;margin-top:2px}
.izoh{margin-top:10px;font-size:14px;color:var(--muted)}
.hidden-ans{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-weight:600;width:100%}
.optlist{display:grid;gap:8px;margin-top:4px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:15.5px;line-height:1.4;transition:.12s}
.opt:hover:not([disabled]){border-color:#b8c6f2}
.opt .L{flex:0 0 28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--pri-2)} .opt.sel .L{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-2)} .opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-2)} .opt.bad .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.static{cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(244,246,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.dock .in{max-width:860px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:14px 10px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--card);box-shadow:var(--shadow);text-align:center}
.btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad-2)}
.btn.sq{flex:0 0 54px}
.btn[disabled]{opacity:.45}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;margin-bottom:12px}
.mode:hover{border-color:var(--pri)}
.mode .ic{flex:0 0 52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--pri-2)}
.mode h3{margin:0;font-size:17px}
.mode p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.mode.main{border-color:var(--pri)}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow)}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
@media(max-width:520px){.navgrid{grid-template-columns:repeat(8,1fr)}}
.nv{aspect-ratio:1;border-radius:9px;background:var(--line);font-size:13px;font-weight:700;display:grid;place-items:center}
.nv.a{background:var(--pri);color:#fff} .nv.cur{outline:3px solid #f59e0b}
.nv.ok{background:var(--ok);color:#fff} .nv.bad{background:var(--bad);color:#fff}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--ok-2);color:#14532d} .feedback.bad{background:var(--bad-2);color:#7f1d1d}
.result{text-align:center;padding:26px 18px}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:34px;font-weight:800}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table.bk{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
table.bk td,table.bk th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.bk td:last-child,table.bk th:last-child{text-align:right}
.rev{margin-top:12px}
.rev .item{padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
.rev .y{color:var(--bad);font-size:14.5px;margin-top:6px} .rev .c{color:var(--ok);font-size:14.5px;font-weight:700;margin-top:2px}
.list .li{padding:14px 2px;border-bottom:1px solid var(--line)}
.list .li .q{font-weight:650}
.list .li .a{color:#166534;font-weight:700;margin-top:4px}
.list .li .z{font-size:13px;color:var(--muted);margin-top:2px}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:16px 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 6px}
.modal .row{display:flex;gap:8px;margin-top:16px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist span{font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media(max-width:620px){.kbd{display:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
</style>
</head>

"w":["qishlogʻi","tokka","qishloqqa"],"nm":1},{"c":"til","s":"r","q":"“Har bir yangi avlod yangi tarixni taqozo etadi uni yaratadi takomillashtiradi uni oʻz dunyoqarashi doirasida vujudga keltiradi”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"3 ta","i":"taqozo etadi, uni yaratadi, takomillashtiradi – dan keyin; uyushiq kesimlar.","l":"y","id":1114,"t":1,"w":["2 ta","4 ta","1 ta"]},{"c":"til","s":"r","q":"“Fuqarolik holati… qayd etuvchi hujjatlar, shaxs… kim ekanligi… va u… huquqlari… tasdiqlovchi hujjatlar davlat tilida rasmiylashtiriladi.” Ushbu gapda -ni qoʻshimchasi necha oʻrinda qoʻllanadi?","a":"3 oʻrinda","i":"holatini, ekanligini, huquqlarini; shaxsning, uning – -ning.","l":"y","id":1115,"t":1,"w":["2 oʻrinda","4 oʻrinda","5 oʻrinda"]},{"c":"til","s":"r","q":"Nuqtalar oʻrniga mos soʻzni qoʻying: “Hujjatlar tanlovlar haqidagi nizomga … tayyorlansin va belgilangan manzilga yuborilsin.”","a":"muvofiq","i":"«-ga muvofiq» – rasmiy uslubdagi turgʻun birikma.","l":"y","id":1116,"t":1,"w":["nisbatan","qarab","qadar"]},{"c":"til","s":"r","q":"Nuqtalar oʻrniga “x” undoshi qoʻyiladigan soʻzlar berilgan javobni belgilang.","a":"...alq, fa...r, i...los","i":"Xalq, faxr, ixlos – x; hayot, hunar, ruh, tahrir – h bilan yoziladi.","l":"o","id":1117,"t":1,"w":["...ayot, ...unar, ru...","...alq, ...ayot, ba...t","...at, ...unar, ta...rir"],"nm":1},{"c":"til","s":"r","q":"“Bayonnomani toʻldirishga baʼzan ham DYHXX, ham haydovchi tomonida xatolarga yoʻl qoʻyishadi”. Ushbu gapda qoʻshimchaning nooʻrin qoʻllanishi necha oʻrinda uchraydi?","a":"2 oʻrinda","i":"toʻldirishga → toʻldirishda, tomonida → tomonidan.","l":"y","id":1118,"t":1,"w":["1 oʻrinda","3 oʻrinda","4 oʻrinda"]},{"c":"til","s":"r","q":"“Majlis bayonnomasining toʻliq shakli faqat yigʻilish xususida emas, balki jamoani faoliyati toʻgʻrisida ham fikr yuritishga imkon beradi”. Ushbu gapda qanday xatolik uchraydi?","a":"Kelishik qoʻshimchasi xatosi: «jamoani» → «jamoaning»","i":"Qaratqich oʻrnida tushum kelishigi qoʻllangan.","l":"y","id":1119,"t":1,"w":["Imloviy xato","Tinish belgisi xatosi","Uslubiy xato"]},{"c":"til","s":"r","q":"“Xat soʻngida shu shaxslarning ismi otaismi va familiyasi lavozimi koʻrsatiladi biroq imzo qoʻyilmaydi chunki bunday xatlar umumiy tashkilot nomidan yuboriladi” Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"4 oʻrinda","i":"ismi, familiyasi, koʻrsatiladi (biroq oldidan), qoʻyilmaydi (chunki oldidan).","l":"y","id":1120,"t":1,"w":["3 oʻrinda","5 oʻrinda","2 oʻrinda"]},{"c":"til","s":"r","q":"Berilgan gapda nuqtalar oʻrniga qoʻyiladigan uslubiy jihatdan mos soʻzni belgilang. “Nafaqa olish uchun berilgan ishonchnomalarning ..., odatda, uch oygacha boʻladi.”","a":"amal qilish muddati","i":"Ishonchnomaning amal qilish muddati — rasmiy birikma.","l":"y","id":1121,"t":1,"w":["kuchga kirish sanasi","rasmiylashtirish vaqti","berilish sanasi"]},{"c":"til","s":"r","q":"“tutmoq” soʻzi qaysi javobda uzatmoq maʼnosida qoʻllangan?","a":"Mezbon mehmonga choy tutdi.","i":"«Choy tutdi» – uzatdi; qolganlarida ushlamoq, roʻza tutmoq maʼnolari.","l":"o","id":1122,"t":1,"w":["Bola daryodan baliq tutdi.","U ramazonda roʻza tutdi.","Ona bolasining qoʻlidan tutdi."],"nm":1},{"c":"til","s":"r","q":"“Avgʻonistondagi qarama qarshilikning dunyo miqyosida kelib chiqishi mumkun boʻlgan havfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"4 oʻrinda","i":"Afgʻonistondagi, qarama-qarshilik, mumkin, xavfli boʻlishi kerak.","l":"y","id":1123,"t":1,"w":["3 oʻrinda","2 oʻrinda","5 oʻrinda"]},{"c":"til","s":"r","q":"“Shartnoma ikki yoki undan ortiq tomonning fuqarolik huquqlari va majburiyatlarini belgilash; oʻzgartirish yoki toʻxtatish yoʻlidagi kelishuvidir.” Ushbu gapda qanday xatolik uchraydi?","a":"Tinish belgisi xatosi: «belgilash;» – nuqtali vergul oʻrniga vergul","i":"Uyushiq boʻlaklar vergul bilan ajratiladi.","l":"y","id":1124,"t":1,"w":["Imloviy xato","Uslubiy xato","Kelishik qoʻshimchasi xatosi"]},{"c":"til","s":"r","q":"Nuqtalar oʻrniga mos soʻzni qoʻying: “Kun tartibidagi masalalarni bayon qilishda maʼruzachining ismi, familiyasi, lavozimini alohida jumla bilan … maqsadga muvofiqdir.”","a":"koʻrsatish","i":"Rasmiy uslubdagi mos soʻz.","l":"y","id":1125,"t":1,"w":["aytish","yozdirish","eslatish"]},{"c":"til","s":"r","q":"Qaysi javobdagi soʻzlar “firibgаr” soʻzi bilan maʼnodosh (sinonim) boʻla oladi?","a":"aldoqchi, qallob, tovlamachi, muttaham","i":"Firibgar — aldab foyda koʻruvchi.","l":"y","id":1126,"t":1,"w":["bezori, oʻgʻri, qaroqchi, tajovuzkor","sotqin, xoin, munofiq, ikkiyuzlamachi","dangasa, yalqov, ishyoqmas, tanbal"]},{"c":"til","s":"r","q":"“…Unda adabiy tilning barcha imkoniyatlarini oʻz ichiga olish bilan birga, oʻzbek shevalariga, kasb-hunarga doir leksik birliklar, bugungi kundalik isteʼmoldan chiqib ketgan tarixiy soʻzlar ham personajlar nutqi orqali ishlatila beradi.” Ushbu maʼlumot qaysi uslub haqida?","a":"Badiiy uslub","i":"Sheva, tarixiy soʻzlar personajlar nutqida — badiiy uslub.","l":"y","id":1127,"t":1,"w":["Soʻzlashuv uslubi","Publitsistik uslub","Ilmiy uslub"]},{"c":"til","s":"r","q":"Xizmat guvohnomalari haqidagi toʻgʻri maʼlumotni belgilang.","a":"Shaxs va uning lavozimini tasdiqlaydi, unda surat, F.I.Sh. va amal muddati boʻladi.","i":"Xizmat guvohnomasi egasining shaxsi va lavozimini tasdiqlaydi; qolganlari ishonchnoma, dalolatnoma, tavsiyanoma.","l":"o","id":1128,"t":1,"w":["Bir shaxsga boshqa shaxs nomidan ish koʻrish vakolatini beradi.","Komissiya tomonidan tuzilib, aniqlangan holatni qayd etadi.","Shaxsni ishga yoki oʻqishga tavsiya etish uchun yoziladi."],"nm":1},{"c":"til","s":"r","q":"Qaysi qatorda soʻz qoʻllash bilan bogʻliq uslubiy xatolik mavjud?","a":"Korxonada boʻsh vakansiya eʼlon qilindi.","i":"«Vakansiya»ning oʻzi boʻsh ish oʻrni; «boʻsh vakansiya» – ortiqcha takror (pleonazm).","l":"o","id":1129,"t":1,"w":["Korxonada vakansiya eʼlon qilindi.","Loyiha uchun optimal yechim topildi.","U oʻz tarjimai holini yozdi."],"nm":1},{"c":"til","s":"r","q":"“bobomiz alisher navoiy “xamsa”dek buyuk asari bilan oʻzbek adabiy tilining shakllanishiga katta hissa qoʻshdi”. Ushbu gapda necha oʻrinda bosh harflar imlosi bilan bogʻliq xatolik uchraydi?","a":"4 oʻrinda","i":"Bobomiz (gap boshi), Alisher Navoiy (atoqli ot), «Xamsa» (asar nomi).","l":"y","id":1130,"t":1,"w":["3 oʻrinda","2 oʻrinda","5 oʻrinda"]},{"c":"til","s":"r","q":"“Demak qizlarda aql-u farosat idrok-u nazokatni tarbiyalashimiz kamol toptirishimiz zarur”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"3 oʻrinda","i":"Demak, … aql-u farosat, idrok-u nazokatni tarbiyalashimiz, kamol toptirishimiz zarur.","l":"y","id":1131,"t":1,"w":["2 oʻrinda","4 oʻrinda","1 oʻrinda"]},{"c":"til","s":"r","q":"Quyida berilgan parcha qaysi hujjat matniga tegishli? “Mazkur holat yuzasidan zaruriy chora-tadbirlar belgilashingizni soʻrayman”","a":"Bildirishnoma","i":"Holat haqida rahbarga xabar berib chora soʻralmoqda.","l":"o","id":1132,"t":1,"w":["Tushuntirish xati","Dalolatnoma","Buyruq"]},{"c":"til","s":"r","q":"“Nomenklatura” soʻzining izohini bildiruvchi birikma qaysi javobda berilgan?","a":"Ish yigʻmajildlari (ishlar) nomlarining tizimlashtirilgan roʻyxati","i":"Nomenklatura — ishlar nomlari roʻyxati.","l":"o","id":1133,"t":1,"w":["Tashkilot xodimlarining shtat jadvali","Hujjatlarni roʻyxatga olish daftari","Rahbar imzolaydigan hujjatlar nusxasi"]},{"c":"til","s":"r","q":"“Ish ishtaha ochar, dangasa ishdan qochar.” Ushbu maqolda ochmoq feʼli qaysi maʼnoda qoʻllangan?","a":"Qoʻzgʻatmoq, uygʻotmoq","i":"Koʻchma maʼno: ish ishtahani qoʻzgʻatadi.","l":"y","id":1134,"t":1,"w":["Boshlamoq, kirishmoq","Kashf etmoq, topmoq","Yoymoq, kengaytirmoq"]},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda toʻsmoq, berkitmoq maʼnosida qoʻllangan?","a":"Derazaga qalin parda tortdi.","i":"«Parda tortdi» – toʻsdi, berkitdi; qolganlarida oʻz maʼnosi, his qilmoq, tarozida oʻlchamoq.","l":"o","id":1135,"t":1,"w":["Bola arqonni tortdi.","U koʻp ati"]},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda tarqatmoq maʼnosida qoʻllangan?","a":"Toʻyda mehmonlarga osh tortildi.","i":"«Osh tortildi» – tarqatildi, ulashildi; qolganlari oʻz maʼnosi, his qilmoq, oʻlchamoq.","l":"o","id":1213,"t":1,"w":["Bola arqonni tortdi.","U koʻp azob tortdi.","Sotuvchi goʻshtni tortdi."],"nm":1},{"c":"til","s":"r","q":"Ushbu gapda // belgisi oʻrnida qaysi tinish belgisi qoʻyilishi kerak? “Mard bir oʻlar, nomard // ming.”","a":"Tire","i":"Tushirilgan kesim oʻrnida tire: Mard bir oʻlar, nomard – ming.","l":"y","id":1214,"t":1,"w":["Vergul","Ikki nuqta","Nuqtali vergul"]},{"c":"til","s":"r","q":"Qaysi uslubda atama, taʼriflar, qoidalar faol qoʻllanadi?","a":"Ilmiy uslub","i":"Atama, taʼrif, qoidalar.","l":"y","id":1215,"t":1,"w":["Rasmiy uslub","Publitsistik uslub","Badiiy uslub"]},{"c":"til","s":"r","q":"Tashkiliy hujjatlar nomi berilgan javobni belgilang.","a":"Nizom, ustav, yoʻriqnoma, shtat jadvali","i":"Tashkiliy hujjatlar.","l":"o","id":1216,"t":1,"w":["Buyruq, farmoyish, qaror, koʻrsatma","Bayonnoma, dalolatnoma, maʼlumotnoma","Ariza, tavsifnoma, ishonchnoma"]},{"c":"til","s":"r","q":"Davrning eng muhim, dolzarb masalalarini oʻquvchilarga, tinglovchilarga, tomoshabinlarga OAV vositalari orqali yetkazish, ommani jonlantirish, kishilarning ongiga atrofda sodir boʻlayotgan voqealarni singdirish, ularning ijtimoiy qarashlarini shakllantirish uchun xizmat qiladigan uslub qanday ataladi?","a":"Publitsistik uslub","i":"OAV orqali ommani jonlantirish.","l":"y","id":1217,"t":1,"w":["Rasmiy uslub","Badiiy uslub","Ilmiy uslub"]},{"c":"til","s":"r","q":"Taraflarning javobgarligi va nizolarni hal qilish tartibi qaysi hujjatda bayon qilinadi?","a":"Shartnoma","i":"Javobgarlik va nizolar bandi.","l":"y","id":1218,"t":1,"w":["Bayonnoma","Dalolatnoma","Ishonchnoma"]},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga “u” unlisi qoʻyiladi?","a":"m...tolaa, b...rgut, k...mush","i":"Mutolaa, burgut, kumush – u; koʻmak, boʻron, goʻzal, toʻp, koʻcha – oʻ bilan.","l":"o","id":1219,"t":1,"w":["k...mak, b...ron, g...zal","m...him, t...p, k...mush","k...cha, m...kofot, b...rgut"],"nm":1},{"c":"til","s":"r","q":"Gapda // oʻrniga qaysi tinish belgisi qoʻyiladi? “Voqea shu qadar tez sodir boʻldiki // hech birimiz tushunishga ulgurmadik.”","a":"Vergul","i":"-ki dan keyin vergul.","l":"y","id":1220,"t":1,"w":["Tire","Ikki nuqta","Nuqtali vergul"]},{"c":"til","s":"r","q":"“Yoʻl harakati qoidalarining buzgan shaxsga nisbatan DYHXX xodimi huquqbuzarlik sodir etilgan joyni oʻzida bayonnoma rasmiylashtirilishi shart”. Ushbu gapda qoʻshimchaning nooʻrin qoʻllanishi necha oʻrinda uchraydi?","a":"3 oʻrinda: qoidalarini, joyning, rasmiylashtirishi","i":"Kelishik qoʻshimchalari va «-il-» nisbat qoʻshimchasi nooʻrin: xodimi … rasmiylashtirishi shart.","l":"o","id":1221,"t":1,"w":["2 oʻrinda: qoidalarini, joyning","1 oʻrinda: joyning","4 oʻrinda: qoidalarini, shaxsga, joyning, rasmiylashtirishi"]},{"c":"til","s":"r","q":"Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim? “Ichki mehnat tartiboti qoidalari mukofotlash nizomi va shu kabilarni tasdiqlash bilan bogʻliq meʼyoriy buyruqlar ham asosiy faoliyatga oid buyruqlar sirasiga kiradi.”","a":"1 oʻrinda: qoidalari, mukofotlash nizomi","i":"Uyushiq toʻldiruvchilar orasida.","l":"o","id":1222,"t":1,"w":["2 oʻrinda: qoidalari, … buyruqlar","3 oʻrinda: qoidalari, nizomi, buyruqlar","Vergul qoʻyilmaydi"]},{"c":"til","s":"r","q":"Tashkiliy hujjat nomi berilgan javobni belgilang.","a":"Nizom","i":"Tashkiliy hujjat.","l":"o","id":1223,"t":1,"w":["Buyruq","Bayonnoma","Maʼlumotnoma"]},{"c":"til","s":"r","q":"“Рецензия” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Taqriz","i":"Рецензия = taqriz.","l":"y","id":1224,"t":1,"w":["Tavsif","Tahrir","Xulosa"]},{"c":"til","s":"r","q":"Hujjat rasmiylashtirish qoidalariga asoslangan holda quyidagi jumlada nuqtalar oʻrniga qoʻyiladigan toʻgʻri javobni belgilang. “Bayonnomada oʻz aksini topgan axborotlarning aniqligi uchun butun masʼuliyat ... zimmasiga yuklatiladi.”","a":"rais va kotib","i":"Bayonnomani ular imzolaydi va javob beradi.","l":"y","id":1225,"t":1,"w":["faqat rais","faqat kotib","barcha qatnashchilar"]},{"c":"til","s":"r","q":"Muayyan xodimni mehnat taʼtiliga chiqarish uchun qanday hujjat rasmiylashtiriladi?","a":"Buyruq (shaxsiy tarkib boʻyicha)","i":"Taʼtil xodim arizasi asosida buyruq bilan.","l":"y","id":1226,"t":1,"w":["Farmoyish","Bildirishnoma","Ariza"]},{"c":"til","s":"r","q":"“yutmoq” soʻzi qaysi javobda naf koʻrmoq maʼnosida qoʻllangan?","a":"Bu savdodan u koʻp yutdi.","i":"«Savdodan yutdi» – foyda, naf koʻrdi; qolganlarida «yutmoq» oʻz maʼnosida.","l":"o","id":1227,"t":1,"w":["Bola tabletkani suv bilan yutdi.","Ilon qurbaqani yutdi.","U bir qultum suv yutdi."],"nm":1},{"c":"til","s":"r","q":"Ushbu parcha qaysi hujjat matnidan namuna hisoblanadi? “Men, D.A.Rahimova, 2024-yilning 10–15-fevral kunlarida Yangiyoʻl shahrining “Lazzat” birlashmasida xizmat safarida boʻldim”.","a":"Hisobot (xizmat safari hisoboti)","i":"Safar haqida I shaxsda.","l":"y","id":1228,"t":1,"w":["Tavsifnoma","Bildirishnoma","Tarjimayi hol"]},{"c":"til","s":"r","q":"Qaysi javobda bayonnomaning zaruriy qismlari berilgan?","a":"Nomi, sana, raqam, rais va kotib, kun tartibi, eshitildi, qaror qilindi, imzolar","i":"Bayonnomada rais, kotib, kun tartibi, «Eshitildi – Qaror qilindi» qismlari boʻladi; qolganlari ariza, dalolatnoma, tavsifnoma.","l":"o","id":1229,"t":1,"w":["Adresat, adresant, matn, ilova, sana, imzo","Komissiya tarkibi, aniqlangan holat, xulosa, nusxa soni","F.I.Sh., tugʻilgan yili, mehnat faoliyati, axloqiy sifatlari"],"nm":1},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga \"o\" unlisi qoʻyiladi?","a":"b...la, ...ta, k...sa","i":"Bola, ota, kosa – o; koʻcha, boʻron, goʻzal, oʻrdak, koʻmak – oʻ bilan.","l":"o","id":1230,"t":1,"w":["k...cha, b...la, ...ta","b...ron, g...zal, ...rdak","...ta, k...mak, b...la"],"nm":1},{"c":"til","s":"r","q":"Qaysi javobda dalolatnomaga xos xususiyat berilgan?","a":"Komissiya tomonidan tuzilib, aniqlangan holatni tasdiqlaydi; aʼzolar imzolaydi.","i":"Dalolatnoma bir necha kishi (komissiya) tomonidan tuziladi, holatni tasdiqlaydi; qolganlari ishonchnoma, bayonnoma, ariza.","l":"o","id":1231,"t":1,"w":["Bir shaxs boshqasiga oʻz nomidan ish koʻrish vakolatini beradi.","Majlisning borishi va qabul qilingan qarorlarni qayd etadi.","Fuqaroning shaxsiy iltimosi yoki taklifini bayon etadi."],"nm":1},{"c":"til","s":"r","q":"Quyidagi gapda belgilab koʻrsatilgan soʻzlardan nechtasi qoʻshib yoziladi? “Bir//necha asrlar mobaynida Markaziy//Osiyoning erk//sevar, sher//yurak xalqi dushmanga qarshi mardlarcha kurashdi”","a":"2 ta: erksevar, sheryurak","i":"bir necha, Markaziy Osiyo ajratib.","l":"y","id":1232,"t":1,"w":["1 ta: erksevar","3 ta: birnecha, erksevar, sheryurak","4 ta: birnecha, MarkaziyOsiyo, erksevar, sheryurak"]},{"c":"til","s":"r","q":"Qaysi javobda quyidagi birlikning qisqartmasi toʻgʻri berilgan? “Oʻzbekiston Respublikasi Markaziy banki”","a":"OʻzR Markaziy banki","i":"Respublika qisqartmasi OʻzR.","l":"o","id":1233,"t":1,"w":["OʻR Markaziy banki","Oʻz.Resp. Markaziy banki","OʻzRMB"]},{"c":"til","s":"r","q":"Ariza uchun xos boʻlmagan rekvizit (tarkibiy qism)ni aniqlang.","a":"Gerbli muhr","i":"Arizada adresat, adresant, matn, sana, imzo boʻladi; gerbli muhr arizaga xos emas.","l":"o","id":1234,"t":1,"w":["Adresat","Sana","Imzo"],"nm":1},{"c":"til","s":"r","q":"Maʼlum bir shaxsning boshqa shaxs nomidan ish koʻrishi uchun vakolat beradigan hujjat qanday nomlanadi?","a":"Ishonchnoma","i":"Vakolat beruvchi hujjat.","l":"y","id":1235,"t":1,"w":["Tilxat","Maʼlumotnoma","Dalolatnoma"]},{"c":"til","s":"r","q":"Qaysi javobda shartnomaga xos xususiyat berilgan?","a":"Ikki yoki undan ortiq tomonning huquq va majburiyatlari belgilanadi.","i":"Shartnoma – tomonlar kelishuvi: huquq-majburiyatlar, muddat, javobgarlik belgilanadi.","l":"o","id":1236,"t":1,"w":["Bir shaxs tomonidan yozilib, shaxsiy iltimos bayon etiladi.","Komissiya const NBITS = DATA.length;
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return Uint8Array.from(bin, c=>c.charCodeAt(0)); }
function setToBits(obj){ const a=new Uint8Array(Math.ceil(NBITS/8)); DATA.forEach((d,i)=>{ if(obj[d.k]) a[i>>3]|=1<<(i&7); }); let n=a.length; while(n>0&&a[n-1]===0) n--; return b64u(a.slice(0,n)); }
function bitsToSet(s){ const o={}; if(!s) return o; const a=unb64u(s); for(let i=0;i<a.length*8&&i<NBITS;i++) if(a[i>>3]&(1<<(i&7))) o[DATA[i].k]=1; return o; }
function makeSyncCode(){
  const h = ST.hist.slice(-30).map(x=>x.p.toString(36)+'-'+Math.round(x.d/60000).toString(36)).join('_');
  return ['v2', setToBits(ST.known), setToBits(ST.again), setToBits(ST.wrong), h].join('.');
}
function applySyncCode(code){
  code = (code||'').trim();
  const m = code.match(/[#&?]s=([^\s&]+)/); if (m) code = decodeURIComponent(m[1]);
  const p = code.split('.'); if (p[0]!=='v2' || p.length<5) throw new Error('kod');
  const K=bitsToSet(p[1]), A=bitsToSet(p[2]), W=bitsToSet(p[3]);
  const before = Object.keys(ST.known).length;
  Object.assign(ST.known, K);
  for (const k in A) if (!ST.known[k]) ST.again[k]=1;
  for (const k in ST.known) delete ST.again[k];
  for (const k in W) ST.wrong[k] = Math.max(ST.wrong[k]||0, 1);
  if (p[4]) { const seen=new Set(ST.hist.map(x=>Math.round(x.d/60000)));
    p[4].split('_').forEach(t=>{ const [pp,dd]=t.split('-'); const d=parseInt(dd,36); if(!seen.has(d)){ ST.hist.push({p:parseInt(pp,36), d:d*60000}); seen.add(d);} });
    ST.hist.sort((a,b)=>a.d-b.d); if (ST.hist.length>50) ST.hist = ST.hist.slice(-50); }
  save();
  return Object.keys(ST.known).length - before;
}

/* ---------- variantlar generatori ---------- */
const YESNO = ['Ha','Yoʻq','Faqat qonunda nazarda tutilgan hollarda','Faqat rahbarning yozma ruxsati bilan'];
function feat(s){ return {num:/\d/.test(s), len:s.length, yn:/^(ha|yoʻq|yo'q)\b/i.test(s)}; }
function makeOptions(item){
  if (item.o) return shuffle(item.o).map(t=>({t, ok: t===item.a}));
  if (item.w && item.w.length>=3) return shuffle([{t:item.a, ok:true}, ...item.w.slice(0,3).map(t=>({t, ok:false}))]);
  const f = feat(item.a);
  let d = [];
  if (f.yn) d = YESNO.filter(x=>!item.a.toLowerCase().startsWith(x.toLowerCase())).slice(0,3);
  if (d.length<3){
    const fromCats = item.c==='oddiy' ? ['oddiy','qonun'] : (item.c==='qonun' ? ['qonun','oddiy'] : [item.c]);
    const pool = testable.filter(x=>fromCats.includes(x.c) && x.id!==item.id && !x.o);
    const seen = new Set([normA(item.a), ...d.map(normA)]);
    const cands = pick(pool, 260).map(x=>{
      const g = feat(x.a);
      let sc = (g.num===f.num?0:3) + Math.abs(g.len-f.len)/Math.max(g.len,f.len,1)*2.2 + (x.c===item.c?0:0.6) - Math.min(overlap(item._t,x._t),3)*0.7 + Math.random()*0.9;
      return {t:x.a, sc};
    }).sort((a,b)=>a.sc-b.sc);
    for (const c of cands){ const k=normA(c.t); if (!seen.has(k) && k.length>0){ seen.add(k); d.push(c.t); if (d.length>=3) break; } }
  }
  return shuffle([{t:item.a, ok:true}, ...d.slice(0,3).map(t=>({t, ok:false}))]);
}

/* ---------- YODLASH ---------- */
let L = { cat: 'oddiy', filter:'all', view:'card', reveal:true, order:'seq', q:'', list:[], idx:0, shown:false, page:0 };
Object.assign(L, ST.prefs.learn||{});
function learnBuild(){
  let a = byCat(L.cat);
  if (L.filter==='new') a = a.filter(d=>!ST.known[d.k]);
  if (L.filter==='again') a = a.filter(d=>ST.again[d.k]);
  if (L.filter==='known') a = a.filter(d=>ST.known[d.k]);
  if (L.q.trim()){ const q=L.q.trim().toLowerCase(); a = a.filter(d=>(d.q+' '+d.a).toLowerCase().includes(q)); }
  if (L.order==='rand') a = shuffle(a);
  L.list = a; if (L.idx>=a.length) L.idx = 0;
}
function learnSavePrefs(){ ST.prefs.learn = {cat:L.cat, filter:L.filter, view:L.view, reveal:L.reveal, order:L.order}; ST.pos[L.cat+'|'+L.filter] = L.idx; save(); }
function setL(k,v){ L[k]=v; if (k!=='idx'){ if(k==='cat'||k==='filter'){ L.idx = ST.pos[L.cat+'|'+L.filter]||0; } L.page=0; learnBuild(); } L.shown=false; L.pick=null; learnSavePrefs(); rLearn(); }
function rLearn(){
  if (!L.list.length && !L._built){ L._built=true; L.idx = ST.pos[L.cat+'|'+L.filter]||0; learnBuild(); }
  const counts = Object.fromEntries(CATS.map(c=>[c.k, byCat(c.k).length]));
  const head = `
  <div class="top"><button class="back" onclick="go('home')">←</button><h1>📖 Yodlash</h1></div>
  <div class="chips">${CATS.map(c=>`<button class="chip ${L.cat===c.k?'on':''}" onclick="setL('cat','${c.k}')">${c.ic} ${c.n}<small>${counts[c.k]}</small></button>`).join('')}</div>
  <div class="tools">
    <div class="seg">${[['all','Hammasi'],['new','Yodlanmagan'],['again','Takrorlash'],['known','Bildim']].map(([k,n])=>`<button class="${L.filter===k?'on':''}" onclick="setL('filter','${k}')">${n}</button>`).join('')}</div>
    <div class="seg">
      <button class="${L.view==='card'&&L.reveal?'on':''}" onclick="L.view='card';setL('reveal',true)">Javob ochiq</button>
      <button class="${L.view==='card'&&!L.reveal?'on':''}" onclick="L.view='card';setL('reveal',false)">Oʻzim oʻylayman</button>
      <button class="${L.view==='list'?'on':''}" onclick="setL('view','list')">Roʻyxat</button>
    </div>
  </div>
  <div class="tools">
    <input class="search" placeholder="🔍 Savol yoki javobdan qidirish..." value="${esc(L.q)}" oninput="L.q=this.value;L.idx=0;L.page=0;learnBuild();clearTimeout(window._st);window._st=setTimeout(()=>{rLearn();const s=document.querySelector('.search');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250)">
    <div class="seg"><button class="${L.order==='seq'?'on':''}" onclick="setL('order','seq')">Tartib bilan</button><button class="${L.order==='rand'?'on':''}" onclick="setL('order','rand')">Aralash 🔀</button></div>
  </div>`;
  if (!L.list.length){ $app.innerHTML = head + `<div class="card empty">Bu filtr boʻyicha savol yoʻq.</div>`; return; }
  if (L.view==='list') return rLearnList(head);
  const d = L.list[L.idx], n = L.list.length;
  const st = ST.known[d.k] ? '<span class="badge b-k">✓ Bildim</span>' : (ST.again[d.k] ? '<span class="badge b-a">↻ Takrorlash</span>' : '');
  const lv = d.nm ? '<span class="badge b-o">📝 namuna variantlar</span>' : (d.l==='o' ? '<span class="badge b-o">◐ oʻrta ishonch</span>' : (d.l==='p' ? '<span class="badge b-p">○ variantga qarab</span>' : ''));
  const showAns = L.reveal || L.shown;
  let ansHtml;
  const izoh = d.i?`<div class="izoh">💡 ${esc(d.i)}</div>`:'';
  const opts = learnOpts(d);
  if (opts){
    if (showAns){
      ansHtml = `<div class="optlist">${opts.map((t,i)=>{ const ok=t===d.a; const cls = ok?'ok':(L.pick===i?'bad':'dim'); return `<div class="opt static ${cls}"><span class="L">${ok?'✓':'ABCD'[i]}</span><span>${esc(t)}</span></div>`; }).join('')}</div>${L.pick!=null?`<div class="feedback ${opts[L.pick]===d.a?'ok':'bad'}"><b>${opts[L.pick]===d.a?'✓ Toʻgʻri!':'✗ Notoʻgʻri.'}</b></div>`:''}${izoh}`;
    } else {
      ansHtml = `<div class="small muted" style="margin-bottom:6px">👆 Javobni tanlang:</div><div class="optlist">${opts.map((t,i)=>`<button class="opt" onclick="L.pick=${i};L.shown=true;rLearn()"><span class="L">${'ABCD'[i]}</span><span>${esc(t)}</span></button>`).join('')}</div><button class="hidden-ans" style="margin-top:10px;padding:12px" onclick="L.shown=true;rLearn()">Javobni koʻrsatish (probel)</button>`;
    }
  } else if (!showAns) ansHtml = `<button class="hidden-ans" onclick="L.shown=true;rLearn()">👆 Javobni koʻrish (boʻsh joy tugmasi)</button>`;
  else ansHtml = `<div class="ans"><div class="lbl">${/^qoida/i.test(d.a)?'📘 Qoida (variantlarga qarab tanlang)':'✔ Toʻgʻri javob'}</div><div class="t">${esc(d.a)}</div></div>${izoh}`;
  $app.innerHTML = head + `
  <div class="card">
    <div class="qnum"><span><b>${L.idx+1}</b> / ${n}</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="badge b-cat">${CATNAME[d.c]}</span>${lv}${st}</span></div>
    <div class="bar pri" style="margin:0 0 10px"><i style="width:${((L.idx+1)/n*100).toFixed(2)}%"></i></div>
    <div class="qtext">${esc(d.q)}</div>
    ${ansHtml}
  </div>
  <div class="kbd">⌨️ ← → oldingi/keyingi · Probel: javobni koʻrish · 1: Takrorlash · 2: Bildim</div>`;
  $dock.innerHTML = `<div class="dock"><div class="in">
    <button class="btn sq" onclick="lMove(-1)" ${L.idx===0?'disabled':''}>◀</button>
    <button class="btn bad" onclick="lMark('again')">↻ Takrorlash</button>
    <button class="btn ok" onclick="lMark('known')">✓ Bildim</button>
    <button class="btn sq" onclick="lMove(1)" ${L.idx>=n-1?'disabled':''}>▶</button>
  </div></div>`;
}
function learnOpts(d){
  let arr = d.o ? d.o.slice() : (d.w && d.w.length>=3 ? [d.a, ...d.w.slice(0,3)] : null);
  if (!arr) return null;
  if (!d.o){ const key=t=>hk(d.k+t); arr.sort((a,b)=>key(a)<key(b)?-1:1); }
  return arr;
}
function lMove(s){ const n=L.list.length; L.idx=Math.max(0,Math.min(n-1,L.idx+s)); L.shown=false; L.pick=null; learnSavePrefs(); rLearn(); }
function lMark(t){
  const d=L.list[L.idx]; if(!d) return;
  if (t==='known'){ ST.known[d.k]=1; delete ST.again[d.k]; } else { ST.again[d.k]=1; delete ST.known[d.k]; }
  save();
  if (L.filter==='new' && t==='known' || L.filter==='again' && t==='known' || L.filter==='known' && t==='again'){ L.list.splice(L.idx,1); if(L.idx>=L.list.length) L.idx=Math.max(0,L.list.length-1); }
  else if (L.idx < L.list.length-1) L.idx++;
  L.shown=false; L.pick=null; learnSavePrefs(); rLearn();
}
function rLearnList(head){
  const per=30, pages=Math.ceil(L.list.length/per); if (L.page>=pages) L.page=0;
  const part=L.list.slice(L.page*per, L.page*per+per);
  const pager = `<div class="pager"><button class="btn sq" ${L.page===0?'disabled':''} onclick="L.page--;rLearn();scrollTo(0,0)">◀</button><span class="small muted">${L.page+1} / ${pages} sahifa</span><button class="btn sq" ${L.page>=pages-1?'disabled':''} onclick="L.page++;rLearn();scrollTo(0,0)">▶</button></div>`;
  $app.innerHTML = head + `<div class="card list">${part.map((d,i)=>`<div class="li"><div class="q">${L.page*per+i+1}. ${esc(d.q)}</div><div class="a">✔ ${esc(d.a)}${(d.w&&d.w.length)?`<div style="color:var(--muted);font-weight:500;font-size:13.5px;margin-top:2px">✗ ${d.w.map(esc).join(' · ')}</div>`:''}${d.l==='p'?' <span class="badge b-p">○</span>':(d.l==='o'?' <span class="badge b-o">◐</span>':'')}</div>${d.i?`<div class="z">${esc(d.i)}</div>`:''}</div>`).join('')}</div>` + pager;
}

/* ---------- TEST: rejim tanlash ---------- */
let Q = null, timerId = null;
function rTest(){
  const wrongN = Object.keys(ST.wrong).length;
  const cc = k => testable.filter(d=>d.c===k).length;
  $app.innerHTML = `
  <div class="top"><button class="back" onclick="go('home')">←</button><h1>📝 Test topshirish</h1></div>

  <button class="mode" onclick="startPractice('mix',20)"><div class="ic">⚡</div><div><h3>Tezkor mashq — 20 savol</h3><p>Barcha boʻlimlardan aralash · javob darhol tekshiriladi</p></div></button>
  <button class="mode" onclick="startPractice('mix',50)"><div class="ic">🏃</div><div><h3>Katta mashq — 50 savol</h3><p>Barcha boʻlimlardan aralash · darhol tekshirish</p></div></button>

  </div>
  <p class="small muted" style="margin-top:16px">Har safar savollar ham, variantlar tartibi ham tasodifiy tanlanadi. Rasmiy bazadagi savollar variantlarsiz eʼlon qilingani uchun notoʻgʻri variantlar boshqa savollarning javoblaridan olinadi. Haqiqiy testda variantlar boshqacha boʻlishi mumkin, shuning uchun toʻgʻri javobning mazmunini yodlang.</p>`;
}
function poolFor(k){ const b = EXAM_BLOCKS.find(x=>x.k===k); const from = b? b.from : [k]; return testable.filter(d=>from.includes(d.c)); }
function mkQ(items){ return items.map(d=>({d, opts:makeOptions(d), ans:null})); }
function startExam(){
  const items = []; EXAM_BLOCKS.forEach(b=> items.push(...pick(poolFor(b.k),10).map(d=>Object.assign({},d,{blk:b.k}))));
  Q = {mode:'exam', list:mkQ(items), i:0, start:Date.now(), limit:60*60*1000, done:false};
  go('quiz');
}
function startPractice(k, n){
  let items;
  if (k==='mix'){ const per=Math.ceil(n/4); items=[]; EXAM_BLOCKS.forEach(b=>items.push(...pick(poolFor(b.k),per).map(d=>Object.assign({},d,{blk:b.k})))); items = shuffle(items).slice(0,n); }
  else items = pick(poolFor(k), n).map(d=>Object.assign({},d,{blk:k}));
  Q = {mode:'practice', title: k==='mix'?'Aralash mashq':CATNAME[k], list:mkQ(items), i:0, start:Date.now(), done:false};
  go('quiz');
}
function startWrong(){
  const items = shuffle(Object.keys(ST.wrong).map(k=>BYK[k]).filter(Boolean)).slice(0,40).map(d=>Object.assign({},d,{blk:EXAM_BLOCKS.find(b=>b.from.includes(d.c))?.k||d.c}));
  Q = {mode:'wrong', title:'Xatolarim', list:mkQ(items), i:0, start:Date.now(), done:false};
  go('quiz');
}

/* ---------- TEST: savol ekrani ---------- */
function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function rQuiz(){
  if (!Q){ go('test'); return; }
  const n = Q.list.length, it = Q.list[Q.i], exam = Q.mode==='exam';
  const answered = Q.list.filter(x=>x.ans!==null).length;
  let timer = '';
  if (exam){ const left = Q.limit-(Date.now()-Q.start); timer = `<span class="timer ${left<5*60000?'low':''}" id="tm">⏱ ${fmt(left)}</span>`;
    if (!timerId) timerId = setInterval(()=>{ const l=Q.limit-(Date.now()-Q.start); const el=document.getElementById('tm'); if(el){ el.textContent='⏱ '+fmt(l); el.classList.toggle('low', l<5*60000);} if(l<=0){ clearInterval(timerId); timerId=null; finish(); } },1000); }
  const showFb = !exam && it.ans!==null;
  const optsHtml = it.opts.map((o,k)=>{
    let cls='';
    if (exam){ if (it.ans===k) cls='sel'; }
    else if (it.ans!==null){ if (o.ok) cls='ok'; else if (it.ans===k) cls='bad'; else cls='dim'; }
    return `<button class="opt ${cls}" ${(!exam && it.ans!==null)?'disabled':''} onclick="answer(${k})"><span class="L">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  let fb = '';
  if (showFb){ const ok = it.opts[it.ans].ok; fb = `<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'✓ Toʻgʻri!':'✗ Notoʻgʻri.'}</b> ${ok?'':'Toʻgʻri javob: <b>'+esc(it.d.a)+'</b>'}${it.d.i?`<div style="margin-top:6px">💡 ${esc(it.d.i)}</div>`:''}</div>`; }
  const grid = exam ? `<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">Savollar xaritasi (${answered}/${n} javob berildi)</summary><div class="navgrid">${Q.list.map((x,k)=>`<button class="nv ${x.ans!==null?'a':''} ${k===Q.i?'cur':''}" onclick="Q.i=${k};rQuiz()">${k+1}</button>`).join('')}</div></details>` : '';
  $app.innerHTML = `
  <div class="tbar"><button class="back" onclick="quitQuiz()">✕</button><div style="flex:1"><div class="small muted">${exam?'Imtihon':esc(Q.title)} · ${CATNAME[it.d.c]}</div><b>${Q.i+1} / ${n}</b></div>${timer}</div>
  <div class="bar pri" style="margin:0 0 14px"><i style="width:${((exam?answered:Q.i+ (it.ans!==null?1:0))/n*100).toFixed(1)}%"></i></div>
  <div class="card">
    <div class="qtext" style="margin-top:0">${esc(it.d.q)}</div>
    <div class="optlist">${optsHtml}</div>
    ${fb}
    ${grid}
  </div>
  <div class="kbd">⌨️ 1–4 yoki A–D: variant tanlash · Enter: keyingi</div>`;
  const last = Q.i>=n-1;
  if (exam) $dock.innerHTML = `<div class="dock"><div class="in"><button class="btn sq" onclick="qMove(-1)" ${Q.i===0?'disabled':''}>◀</button><button class="btn" onclick="askFinish()">Yakunlash</button><button class="btn pri" onclick="${last?'askFinish()':'qMove(1)'}">${last?'Natija':'Keyingi ▶'}</button></div></div>`;
  else $dock.innerHTML = `<div class="dock"><div class="in"><button class="btn" onclick="askFinish()">Yakunlash</button><button class="btn pri" ${it.ans===null?'disabled':''} onclick="${last?'finish()':'qMove(1)'}">${last?'Natijani koʻrish':'Keyingi ▶'}</button></div></div>`;
}
function answer(k){
  const it = Q.list[Q.i];
  if (Q.mode==='exam'){ it.ans=k; rQuiz(); setTimeout(()=>{ if(Q && Q.mode==='exam' && Q.i<Q.list.length-1 && VIEW==='quiz'){ Q.i++; rQuiz(); } }, 260); return; }
  if (it.ans!==null) return;
  it.ans = k; const ok = it.opts[k].ok;
  if (ok){ if (Q.mode==='wrong') delete ST.wrong[it.d.k]; }
  else ST.wrong[it.d.k] = (ST.wrong[it.d.k]||0)+1;
  save(); rQuiz();
}
function qMove(s){ Q.i = Math.max(0, Math.min(Q.list.length-1, Q.i+s)); rQuiz(); window.scrollTo(0,0); }
function askFinish(){
  const left = Q.list.filter(x=>x.ans===null).length;
  modal('Testni yakunlaysizmi?', left? `Hali <b>${left}</b> ta savolga javob berilmagan. Javobsiz savollar xato hisoblanadi.` : 'Barcha savollarga javob berildi.', 'Yakunlash', finish, 'Davom etish');
}
function quitQuiz(){ modal('Testdan chiqasizmi?', 'Bu urinish natijasi saqlanmaydi.', 'Chiqish', ()=>{ clearInterval(timerId); timerId=null; Q=null; go('test'); }, 'Davom etish'); }
function finish(){
  clearInterval(timerId); timerId=null;
  Q.done = true; Q.end = Date.now();
  if (Q.mode==='exam'){
    Q.list.forEach(x=>{ const ok = x.ans!==null && x.opts[x.ans].ok; if(!ok) ST.wrong[x.d.k]=(ST.wrong[x.d.k]||0)+1; });
    const c = Q.list.filter(x=>x.ans!==null && x.opts[x.ans].ok).length;
    ST.hist.push({p:Math.round(c/Q.list.length*100), d:Date.now()}); if (ST.hist.length>50) ST.hist.shift();
    save();
  }
  go('result');
}

/* ---------- NATIJA ---------- */
function rResult(){

  const pass = p>=56, exam = Q.mode==='exam';
  const blocks = EXAM_BLOCKS.map(b=>{ const xs=Q.list.filter(x=>x.d.blk===b.k); return {n:b.n, t:xs.length, c:xs.filter(x=>x.ans!==null && x.opts[x.ans].ok).length}; }).filter(b=>b.t);

  $app.innerHTML = `

    <table class="bk"><tr><th>Boʻlim</th><th>Natija</th></tr>${blocks.map(b=>`<tr><td>${b.n}</td><td><b>${b.c}</b> / ${b.t}</td></tr>`).join('')}</table>
  </div>
  <div class="grid2" style="margin-top:14px">
    <button class="btn pri" onclick="${exam?'startExam()':`startPractice('mix',${n})`}">↻ Yana ${exam?'imtihon':'mashq'}</button>
    <button class="btn" onclick="go('test')">Rejimlar</button>
  </div>
  ${wrongs.length?`<div class="sec-t">Xatolar tahlili (${wrongs.length})</div><div class="rev">${wrongs.map((x,k)=>`<div class="item"><div style="font-weight:650">${k+1}. ${esc(x.d.q)}</div>${x.ans!==null?`<div class="y">✗ Siz: ${esc(x.opts[x.ans].t)}</div>`:'<div class="y">✗ Javob berilmagan</div>'}<div class="c">✔ ${esc(x.d.a)}</div>${x.d.i?`<div class="small muted" style="margin-top:4px">💡 ${esc(x.d.i)}</div>`:''}</div>`).join('')}</div>`:'<div class="card empty" style="margin-top:14px">Hammasi toʻgʻri! 👏</div>'}`;
}

/* ---------- klaviatura ---------- */
document.addEventListener('keydown', e=>{
  if ($modal.innerHTML) { if (e.key==='Escape') closeModal(); return; }
  if (e.target.tagName==='INPUT') return;
  if (VIEW==='learn' && L.view==='card'){
    if (e.key==='ArrowRight') lMove(1); else if (e.key==='ArrowLeft') lMove(-1);
    else if (e.key===' '){ e.preventDefault(); L.shown=true; rLearn(); }
    else if (e.key==='1') lMark('again'); else if (e.key==='2') lMark('known');
    else if (!L.reveal && !L.shown && 'abcd'.includes(e.key.toLowerCase())){ const d=L.list[L.idx]; const o=learnOpts(d); const k='abcd'.indexOf(e.key.toLowerCase()); if(o&&o[k]!==undefined){ L.pick=k; L.shown=true; rLearn(); } }
  } else if (VIEW==='quiz' && Q){
    const m = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
    if (m!==undefined && Q.list[Q.i].opts[m]) answer(m);
    else if (e.key==='Enter'){ const it=Q.list[Q.i]; if (Q.mode==='exam' || it.ans!==null){ if (Q.i<Q.list.length-1) qMove(1); else (Q.mode==='exam'?askFinish():finish()); } }
    else if (e.key==='ArrowRight' && Q.mode==='exam') qMove(1); else if (e.key==='ArrowLeft' && Q.mode==='exam') qMove(-1);
  }
});
let h0 = location.hash.slice(1);
if (h0.startsWith('s=')) {
  try { const n = applySyncCode('#'+h0); setTimeout(()=>toast(`✓ Boshqa qurilmadagi natijalar qoʻshildi (+${n} ta yodlangan)`), 300); } catch(e){ setTimeout(()=>toast('✗ Sinxronlash havolasi notoʻgʻri'), 300); }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash=''; }
  h0 = '';
}
VIEW = (h0==='learn'||h0==='test') ? h0 : 'home';
render();
</script>
</body>
</html>
