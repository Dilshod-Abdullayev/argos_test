ohi mos keladi?","a":"Mem","i":"Internet memi","l":"y","id":1124,"t":1},{"c":"til","s":"r","q":"“Mutaxasislarning fikricha, odamzodning tabiatga nisbatan tajovuzkorona munosabati shu taxlit dovom etaversa, virusli epidemialar hayot uchun jiddiy taxdid boʻlishi mumkun”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"6 ta: mutaxasis, taxlit, dovom, epidemialar, taxdid, mumkun","i":"tabiatga toʻgʻri","l":"y","id":1125,"t":1},{"c":"til","s":"r","q":"“Ma’lumotnoma sanasi u imzolangan kuni qoʻyiladi, chunki, u joʻnatma hujjatlar daftarida qayd etiladi”. Ushbu gapda qanday xatolik uchraydi?","a":"Tinish belgisi xatosi: 'chunki'dan keyingi vergul ortiqcha","i":"Bogʻlovchidan keyin vergul qoʻyilmaydi","l":"y","id":1126,"t":1},{"c":"til","s":"r","q":"Ushbu parchada nechta imloviy xatolik uchraydi? “Ota-bobolarimiz, momolarimiz bizga yoshligimizdanoq ozodalik, saranjom-sarishtalik, halollik va harom-harish haqida soʻzlab, pandu nasihatlar bilan ongimizga singdirishga uringanlar.”","a":"1 ta: pandu→pand-u","i":"-u yuklamasi chiziqcha bilan","l":"y","id":1127,"t":1},{"c":"til","s":"r","q":"“Mudxish, iftixor, me’ros, tadbiq” berilgan soʻzlardan nechtasida imloviy xatolik uchraydi?","a":"3 ta: mudhish, meros, tatbiq; iftixor toʻgʻri","i":"Imlo lugʻatiga koʻra","l":"y","id":1128,"t":1},{"c":"til","s":"r","q":"\"Nashriyotning bosh … koʻp jildli «Oʻzbekiston milliy ensiklopediyasi»ni yuksak gʻoyaviy-ilmiy saviyada va yuqori matbaa darajasida tayyorlash va nashr etishdir.","a":"vazifasi","i":"Nashriyotning bosh vazifasi …dir","l":"o","id":1129,"t":1},{"c":"til","s":"r","q":"Qaysi javobda dalolatnomaning zaruriy qismlari berilgan?","a":"Qoida: nomi, sana, raqam, joy, asos, komissiya tarkibi, matn (holat, xulosa), nusxa soni, imzolar","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1130,"t":0},{"c":"til","s":"r","q":"Xodimning tashkilot nomidan sud idoralarida da’vogar va javobgar sifatida ish yuritishiga vakolat berish uchun qanday hujjat rasmiylashtiriladi?","a":"Ishonchnoma","i":"Sudda vakillik vakolati","l":"y","id":1131,"t":1},{"c":"til","s":"r","q":"Qaysi javobda imloviy xatolik kuzatilmagan?","a":"Qoida: barcha soʻzlarni imlo lugʻati boʻyicha tekshiring","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1132,"t":0},{"c":"til","s":"r","q":"“Yaqin orada boʻladigan majlis uchrashuv suhbat shuningdek ishga oʻqishga qabul qilish haqida xabardor qilish uchun qoʻllanuvchi yozma axborot e’lon deb ataladi” Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"5 ta: majlis, uchrashuv, suhbat, shuningdek, ishga,","i":"Uyushiq boʻlaklar va shuningdek","l":"o","id":1133,"t":1},{"c":"til","s":"r","q":"“barter, birja, aksiya, bankamat, investisiya, disertatsiya, assistant”.Berilgan soʻzlardan nechtasi imloviy jihatdan toʻgʻri yozilgan?","a":"3 ta: barter, birja, aksiya","i":"bankomat, investitsiya, dissertatsiya, assistent","l":"y","id":1134,"t":1},{"c":"til","s":"r","q":"“Mutaxassislarning fikricha, odamzodning tabiatga nisbatan tajovuzkorona munosabati shu tahlit davom etaversa, virusli epidemiyalar hayot uchun jiddiy tahdid boʻlishi mumkun”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"1 ta: mumkun→mumkin","i":"Qolganlari toʻgʻri","l":"y","id":1135,"t":1},{"c":"til","s":"r","q":"Ishonchnomaga xos xususiyat berilgan javobni belgilang.","a":"Qoida: bir shaxs/tashkilot boshqa shaxsga uning nomidan ish koʻrish vakolatini beradi; imzo muhr/notarial tasdiqlanadi","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1136,"t":0},{"c":"til","s":"r","q":"Qaysi javobda boʻgʻin koʻchirish qoidalariga amal qilingan?","a":"Qoida: bir harf qoldirilmaydi/koʻchirilmaydi; sh, ch, ng, oʻ, gʻ boʻlinmaydi; tutuq belgisi oldingi satrda","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1137,"t":0},{"c":"til","s":"r","q":"\"Oʻz majburiyatlarini … yoki lozim darajada bajarmaganlik uchun taraflar amaldagi qonun … va mazkur shartnomaga … javobgar boʻladilar.","a":"bajarmaganlik; hujjatlariga; muvofiq","i":"Shartnomaning standart bandi","l":"o","id":1138,"t":1},{"c":"til","s":"r","q":"“buyuk ajdodlarimizdan biri mahmud koshgʻariy “bayram – xalqning shodlik va xursandchilik kunidir”, – deb yozgan edi”. Ushbu gapda necha oʻrinda bosh harflar imlosi bilan bogʻliq xatolik uchraydi?","a":"4 ta: Buyuk, Mahmud, Koshgʻariy, Bayram","i":"Gap boshi, atoqli ot, koʻchirma boshi","l":"y","id":1139,"t":1},{"c":"til","s":"r","q":"“Ультиматум” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Qatʼiy talab (rad etib boʻlmaydigan talab)","i":"Ультиматум tarjimasi","l":"y","id":1140,"t":1},{"c":"til","s":"r","q":"Imloviy xato yozilgan soʻzni belgilang.","a":"Qoida: imlo lugʻati boʻyicha tekshiring","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1141,"t":0},{"c":"til","s":"r","q":"“Me’moriy obidalar tari…imizning naqadar ulugʻvorligidan dalolat berib turibdi. So…ibqiron bobomiz Amir Temur oʻzi qurdirgan …ashamatli Oqsaroy peshtoqiga: Qudratimizga shak-shub…angiz boʻlsa, biz qurdirgan binolarga boqing, – deb yozdirgan edi”.Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “h” qoʻllanadi?","a":"3 ta: Sohibqiron, hashamatli, shak-shubhangiz","i":"tarixi­mizning – x","l":"y","id":1142,"t":1},{"c":"til","s":"r","q":"“tasarruf, matba, istirob, mutoala” berilgan soʻzlardan nechtasida imloviy xatolik uchraydi?","a":"3 ta: matbaa, iztirob, mutolaa (tasarruf toʻgʻri)","i":"Matba, istirob, mutoala xato yozilgan.","l":"y","id":1143,"t":1},{"c":"til","s":"r","q":"Quyida berilgan parcha qaysi hujjat matniga tegishli? “Ijrosini nazorat qilish direktor oʻrinbosarlari zimmasiga yuklatilsin”","a":"Buyruq","i":"«...zimmasiga yuklatilsin» — buyruqning nazorat bandi.","l":"y","id":1144,"t":1},{"c":"til","s":"r","q":"Xizmat guvohnomalarini yoʻq qilish qanday hujjat orqali rasmiylashtiriladi?","a":"Dalolatnoma","i":"Hujjat/guvohnomalarni yoʻq qilish dalolatnoma bilan rasmiylashtiriladi.","l":"y","id":1145,"t":1},{"c":"til","s":"r","q":"“Doimiy maslahat organi yigʻilishining bayonnomasida yigʻilishda ishtirok etuvchilar soni … juda muhimdir, chunki bu huquqiy ahamiyatga ega.”\"","a":"koʻrsatilishi","i":"Bayonnomada ishtirokchilar soni koʻrsatilishi shart (kvorum).","l":"o","id":1146,"t":1},{"c":"til","s":"r","q":"Ushbu gapda qaysi oʻrin(lar)da -ning qoʻshimchasi qoʻllanadi? \"","a":"Qoida: qaratqich -ning egalik qoʻshimchali soʻzdan oldin keladi: shaxsning (kim ekanligi), uning (huquqlari)","i":"Gap berilmagan; 10-savoldagi gapga koʻra shaxs- va u- dan keyin.","l":"p","id":1147,"t":0},{"c":"til","s":"r","q":"“turmoq” soʻzi qaysi javobda qoʻzgʻalmoq, koʻtarilmoq ma’nosida qoʻllangan?","a":"Qoida: «turmoq» = paydo boʻlmoq, koʻtarilmoq: «Chang turdi», «Shamol turdi», «Toʻzon turdi»","i":"Variantlar berilmagan.","l":"p","id":1148,"t":0},{"c":"til","s":"r","q":"“tutmoq” soʻzi qaysi javobda ushlamoq ma’nosida qoʻllangan?","a":"Qoida: «tutmoq» = ushlamoq: «Qoʻlidan mahkam tutdi», «Oʻgʻrini tutdi»","i":"Variantlar berilmagan.","l":"p","id":1149,"t":0},{"c":"til","s":"r","q":"Qoʻshimcha qoʻshilishi bilan bogʻliq imloviy xatolikka yoʻl qoʻyilgan javobni belgilang.","a":"Qoida: koʻp boʻgʻinli k/q bilan tugagan soʻzga -i/-im qoʻshilsa g/gʻ: yuragi, qishlogʻi; -ga: tokka, qishloqqa, togʻga; burun→burni","i":"Variantlar berilmagan.","l":"p","id":1150,"t":0},{"c":"til","s":"r","q":"“Har bir yangi avlod yangi tarixni taqozo etadi uni yaratadi takomillashtiradi uni oʻz dunyoqarashi doirasida vujudga keltiradi”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"3 oʻrinda: ...taqozo etadi, uni yaratadi, takomillashtiradi, uni...","i":"Uyushiq kesimlar orasida vergul.","l":"y","id":1151,"t":1},{"c":"til","s":"r","q":"\"Fuqarolik holati… qayd etuvchi hujjatlar, shaxs… kim ekanligi… va u… huquqlari… tasdiqlovchi hujjatlar davlat tilida rasmiylashtiriladi.","a":"holatini, shaxsning, ekanligini, uning, huquqlarini","i":"Fuqarolik holatini qayd etuvchi..., shaxsning kim ekanligini va uning huquqlarini tasdiqlovchi.","l":"o","id":1152,"t":1},{"c":"til","s":"r","q":"Ushbu gapda -ni qoʻshimchasi necha oʻrinda qoʻllanadi? \"","a":"Qoida: -ni tushum kelishigi oʻtimli fe'l oldidagi aniq toʻldiruvchiga qoʻshiladi (holatini, ekanligini, huquqlarini)","i":"Gap berilmagan; 10-gapda -ni 3 oʻrinda.","l":"p","id":1153,"t":0},{"c":"til","s":"r","q":"Hujjatlar tanlovlar haqidagi nizomga .. tayyorlansin va belgilangan manzilga yuborilsin.\"","a":"muvofiq (nizomga muvofiq tayyorlansin)","i":"-ga + muvofiq rasmiy uslubdagi turgʻun birikma.","l":"o","id":1154,"t":1},{"c":"til","s":"r","q":"Nuqtalar oʻrniga “x” undoshi qoʻyiladigan soʻzlar berilgan javobni belgilang.","a":"Qoida: x — boʻgʻiz boʻlmagan (xat, xalq, baxt, faxr, ixlos, tarix); h — boʻgʻiz (hayot, hunar, ahamiyat, ruh)","i":"Variantlar berilmagan.","l":"p","id":1155,"t":0},{"c":"til","s":"r","q":"“Bayonnomani toʻldirishga ba’zan ham DYHXX, ham haydovchi tomonida xatolarga yoʻl qoʻyishadi”. Ushbu gapda qoʻshimchaning nooʻrin qoʻllanishi necha oʻrinda uchraydi?","a":"2 oʻrinda: toʻldirishda, tomonidan","i":"«toʻldirishga» va «tomonida» xato qoʻshimcha.","l":"y","id":1156,"t":1},{"c":"til","s":"r","q":"“Majlis bayonnomasining toʻliq shakli faqat yigʻilish xususida emas, balki jamoani faoliyati toʻgʻrisida ham fikr yuritishga imkon beradi”. Ushbu gapda qanday xatolik uchraydi?","a":"Kelishik qoʻshimchasi xatosi: «jamoani» oʻrniga «jamoaning»","i":"Qaratqich oʻrnida tushum kelishigi qoʻllangan.","l":"y","id":1157,"t":1},{"c":"til","s":"r","q":"“Xat soʻngida shu shaxslarning ismi otaismi va familiyasi lavozimi koʻrsatiladi biroq imzo qoʻyilmaydi chunki bunday xatlar umumiy tashkilot nomidan yuboriladi” Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"4 oʻrinda: ismi, otaismi va familiyasi, lavozimi koʻrsatiladi, biroq ..., chunki","i":"Uyushiq boʻlaklar va biroq/chunki oldidan vergul.","l":"o","id":1158,"t":1},{"c":"til","s":"r","q":"Berilgan gapda nuqtalar oʻrniga qoʻyiladigan uslubiy jihatdan mos soʻzni belgilang. “Nafaqa olish uchun berilgan ishonchnomalarning ..., odatda, uch oygacha boʻladi.”","a":"amal qilish muddati","i":"Ishonchnomaning amal qilish muddati — rasmiy birikma.","l":"y","id":1159,"t":1},{"c":"til","s":"r","q":"“tutmoq” soʻzi qaysi javobda uzatmoq ma’nosida qoʻllangan?","a":"Qoida: «tutmoq» = uzatmoq: «Mehmonga choy tutdi», «Kosani tutdi»","i":"Variantlar berilmagan.","l":"p","id":1160,"t":0},{"c":"til","s":"r","q":"“Avgʻonistondagi qarama qarshilik¬ning dunyo miqyosida kelib chiqishi mumkun boʻlgan havfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"4 oʻrinda: Afgʻonistondagi, qarama-qarshilik, mumkin, xavfli","i":"Avgʻ-, chiziqchasiz juft soʻz, mumkun, havfli xato.","l":"y","id":1161,"t":1},{"c":"til","s":"r","q":"“Shartnoma ikki yoki undan ortiq tomonning fuqarolik huquqlari va majburiyatlarini belgilash; oʻzgartirish yoki toʻxtatish yoʻlidagi kelishuvidir.” Ushbu gapda qanday xatolik uchraydi?","a":"Tinish belgisi xatosi: «belgilash;» dagi nuqtali vergul oʻrniga vergul","i":"Uyushiq boʻlaklar vergul bilan ajratiladi.","l":"y","id":1162,"t":1},{"c":"til","s":"r","q":"“Kun tartibidagi masalalarni bayon qilishda ma’ruzachining ismi, familiyasi, lavozimini alohida jumla bilan … maqsadga muvofiqdir.”\"","a":"koʻrsatish (alohida jumla bilan koʻrsatish maqsadga muvofiq)","i":"Rasmiy uslubdagi mos soʻz.","l":"o","id":1163,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi soʻzlar “firibgаr” soʻzi bilan ma’nodosh (sinonim) boʻla oladi?","a":"aldoqchi, qallob, tovlamachi, muttaham","i":"Firibgar — aldab foyda koʻruvchi.","l":"o","id":1164,"t":1},{"c":"til","s":"r","q":"\"“…Unda adabiy tilning barcha imkoniyatlarini oʻz ichiga olish bilan birga, oʻzbek shevalariga, kasb-hunarga doir leksik birliklar, bugungi kundalik iste’moldan chiqib ketgan tarixiy soʻzlar ham personajlar nutqi orqali ishlatila beradi”.","a":"Badiiy uslub (shuningdek «ishlatila beradi» → «ishlatilaveradi»)","i":"Sheva, tarixiy soʻzlar personajlar nutqida — badiiy uslub.","l":"o","id":1165,"t":1},{"c":"til","s":"r","q":"Ushbu ma’lumot qaysi uslub haqida? \"","a":"Badiiy uslub","i":"Adabiy til + sheva, kasb-hunar, tarixiy soʻzlar personaj nutqida.","l":"o","id":1166,"t":1},{"c":"til","s":"r","q":"Xizmat guvohnomalari haqidagi toʻgʻri ma’lumotni belgilang.","a":"Qoida: xizmat guvohnomasi shaxs va lavozimini tasdiqlaydi; surat, F.I.Sh., lavozim, amal muddati, rahbar imzosi, muhr boʻladi","i":"Variantlar berilmagan.","l":"p","id":1167,"t":0},{"c":"til","s":"r","q":"Qaysi qatorda soʻz qoʻllash bilan bogʻliq uslubiy xatolik mavjud?","a":"Qoida: uslubiy xato — ortiqcha takror (pleonazm: «boʻsh vakansiya», «eng optimal»), paronim aralashuvi, noloyiq soʻz","i":"Variantlar berilmagan.","l":"p","id":1168,"t":0},{"c":"til","s":"r","q":"“bobomiz alisher navoiy “xamsa”dek buyuk asari bilan oʻzbek adabiy tilining shakllanishiga katta hissa qoʻshdi”. Ushbu gapda necha oʻrinda bosh harflar imlosi bilan bogʻliq xatolik uchraydi?","a":"4 oʻrinda: Bobomiz, Alisher, Navoiy, «Xamsa»","i":"Gap boshi, ism-familiya, asar nomi bosh harf bilan.","l":"y","id":1169,"t":1},{"c":"til","s":"r","q":"“Demak qizlarda aql-u farosat idrok-u nazokatni tarbiyalashimiz kamol toptirishimiz zarur”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"3 oʻrinda: Demak, ... aql-u farosat, idrok-u nazokatni tarbiyalashimiz, kamol...","i":"Kirish soʻz, uyushiq toʻldiruvchi va kesimlar.","l":"y","id":1170,"t":1},{"c":"til","s":"r","q":"Quyida berilgan parcha qaysi hujjat matniga tegishli? “Mazkur holat yuzasidan zaruriy chora-tadbirlar belgilashingizni soʻrayman”","a":"Bildirishnoma","i":"Holat haqida rahbarga xabar berib chora soʻralmoqda.","l":"o","id":1171,"t":1},{"c":"til","s":"r","q":"“Nomenklatura” soʻzining izohini bildiruvchi birikma qaysi javobda berilgan?","a":"Ish yigʻmajildlari (ishlar) nomlarining tizimlashtirilgan roʻyxati","i":"Nomenklatura — ishlar nomlari roʻyxati.","l":"o","id":1172,"t":1},{"c":"til","s":"r","q":"\"Ushbu maqolda ochmoq fe’li qaysi ma’noda qoʻllangan?","a":"qoʻzgʻatmoq, uygʻotmoq (ishtahani qoʻzgʻatmoq)","i":"Koʻchma ma'no.","l":"y","id":1173,"t":1},{"c":"til","s":"r","q":"Ish ishtaha ochar, dangasa ishdan qochar. \"","a":"«ochmoq» — qoʻzgʻatmoq, uygʻotmoq ma'nosida","i":"31-savolning maqoli.","l":"y","id":1174,"t":1},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda toʻsmoq, berkitmoq ma’nosida qoʻllangan?","a":"Qoida: «tortmoq» = toʻsmoq: «Parda tortdi», «Devor tortdi», «Toʻr tortdi»","i":"Variantlar berilmagan.","l":"p","id":1175,"t":0},{"c":"til","s":"r","q":"Davlatlarning biror masala yuzasidan oʻzaro qabul qilgan qarorlari yuzasidan bergan bayonnomasi qanday ataladi?","a":"Kommyunike","i":"Muzokaralar natijasi haqidagi rasmiy bayonot.","l":"o","id":1176,"t":1},{"c":"til","s":"r","q":"\"Ushbu gapda qaysi tinish belgisi tushirib qoldirilgan?","a":"Tire: Samarqand – olamning sayqali va koʻrki.","i":"Ega va kesim ot bilan ifodalangan, bogʻlama yoʻq.","l":"y","id":1177,"t":1},{"c":"til","s":"r","q":"Samarqand olamning sayqali va koʻrki.\"","a":"Tire (Samarqand – olamning...)","i":"Ot-kesim oldidan tire.","l":"y","id":1178,"t":1},{"c":"til","s":"r","q":"\"Ushbu parchada qaysi hujjat taʼrifi keltirilgan?","a":"Hisobot","i":"Bajarilgan ish, safar yakuni haqida ma'lumot.","l":"y","id":1179,"t":1},{"c":"til","s":"r","q":"“Muayyan vaqt uchun rejalashtirilgan ish yoki vazifa, topshiriqlarning bajarilishi, amaliy dolzarb ishlar, xizmat va ilmiy safarlar yakuni haqida ma’lumot beruvchi hujjat”.","a":"Hisobot","i":"Ta'rif hisobotga tegishli.","l":"y","id":1180,"t":1},{"c":"til","s":"r","q":"“Mutaxassislarning fikricha, odamzodning tabiyatga nisbatan tajovuzkorona munosabati shu tahlit davom etaversa, virusli epidemialar hayot uchun jiddiy taxdid boʻlishi mumkun”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"5 oʻrinda: tabiatga, taxlit, epidemiyalar, tahdid, mumkin","i":"tabiyat, tahlit, epidemia, taxdid, mumkun xato.","l":"o","id":1181,"t":1},{"c":"til","s":"r","q":"\"Ushbu parcha qaysi hujjat matnidan namuna hisoblanadi? “Ma’lum bir shaxsning mehnat va ijtimoiy faoliyati, shuningdek, uning oʻziga xos xislat va fazilatlarini aks ettiruvchi rasmiy hujjat”.","a":"Tavsifnoma","i":"Mehnat faoliyati va fazilatlarni aks ettiradi.","l":"y","id":1182,"t":1},{"c":"til","s":"r","q":"Muassasa yoki ayrim shaxslar faoliyati bilan bogʻliq boʻlib oʻtgan (sodir boʻlgan) voqea, ish harakatni yoki mavjud holatni tasdiqlash, unga guvohlik berish maqsadida bir necha kishi tomonidan tuzilgan hujjat qanday ataladi?","a":"Dalolatnoma","i":"Bir necha kishi tuzib, holatni tasdiqlaydi.","l":"y","id":1183,"t":1},{"c":"til","s":"r","q":"“Себестоимость” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Tannarx","i":"Себестоимость = tannarx.","l":"y","id":1184,"t":1},{"c":"til","s":"r","q":"Shaxsiy ishonchnomalar haqida notoʻgʻri ma’lumot berilgan javobni belgilang.","a":"Qoida: shaxsiy ishonchnomani fuqaro beradi, notarial yoki ish joyida tasdiqlanadi, muddati koʻrsatiladi (koʻrsatilmasa 1 yil, maks. 3 yil)","i":"Variantlar berilmagan.","l":"p","id":1185,"t":0},{"c":"til","s":"r","q":"“Bu yangilikning avzalligini tushunsa ham unga toʻgʻonoq boʻlayotganlar borligi achinarlidir”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"2 oʻrinda: afzalligini, toʻgʻanoq","i":"avzallik, toʻgʻonoq xato.","l":"y","id":1186,"t":1},{"c":"til","s":"r","q":"“Afgʻonistondagi qarama-qarshilik¬ning dunyo miqyosida kelib chiqishi mumkun boʻlgan havfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"2 oʻrinda: mumkin, xavfli","i":"Afgʻoniston va qarama-qarshilik toʻgʻri.","l":"y","id":1187,"t":1},{"c":"til","s":"r","q":"“Уведомление” soʻzining oʻzbekcha muqobilini toping.","a":"Bildirishnoma (xabarnoma)","i":"Уведомление — xabar beruvchi hujjat.","l":"o","id":1188,"t":1},{"c":"til","s":"r","q":"Qaysi javobda tarjimayi hol matniga tegishli parcha berilgan?","a":"Qoida: tarjimai hol I shaxsda: «Men, F.I.Sh., 19__-yilda ... tugʻildim», ta'lim, mehnat yoʻli, oila","i":"Variantlar berilmagan.","l":"p","id":1189,"t":0},{"c":"til","s":"r","q":"Quyidagi gapda belgilab koʻrsatilgan soʻzlardan nechtasi ajratib yoziladi? “Shifokorlarning aytishicha, och//koʻzlik turli kasalliklarga, osh//qozon tizimining buzilishiga, yuzga husn//buzarlar toshishiga olib//keladi”","a":"1 ta: olib keladi","i":"ochkoʻzlik, oshqozon, husnbuzar qoʻshib yoziladi.","l":"y","id":1190,"t":1},{"c":"til","s":"r","q":"“Me’moriy obidalar tari…imizning naqadar ulugʻvorligidan dalolat berib turibdi. So…ibqiron bobomiz Amir Temur oʻzi qurdirgan …ashamatli Oqsaroy peshtoqiga: Qudratimizga shak-shub…angiz boʻlsa, biz qurdirgan binolarga boqing, – deb yozdirgan edi”. Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “x” qoʻllanadi?","a":"1 ta: tarixmizning","i":"Sohibqiron, hashamatli, shak-shubha — h.","l":"y","id":1191,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi barcha soʻzlar imloviy jihatdan toʻgʻri yozilgan?","a":"Qoida: 1995-yil imlo qoidalari — ʼ, x/h, juft undosh, oʻ/gʻ, qoʻshma soʻz imlosini tekshiring","i":"Variantlar berilmagan.","l":"p","id":1192,"t":0},{"c":"til","s":"r","q":"“Взнос” soʻzining oʻzbekcha muqobilini toping.","a":"Badal","i":"Взнос = badal (toʻlov).","l":"o","id":1193,"t":1},{"c":"til","s":"r","q":"“Avgʻonistondagi qarama qarshilik¬ning dunyo miqyosida kelib chiqishi mumkun boʻlgan xavfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"3 oʻrinda: Afgʻonistondagi, qarama-qarshilik, mumkin","i":"xavfli toʻgʻri yozilgan.","l":"y","id":1194,"t":1},{"c":"til","s":"r","q":"Qaysi hujjat muassasa, korxona, tashkilot, yuridik shaxslar va boshqalar (ularning boʻlinmalari, xizmatlari), mansabdor shaxs va fuqarolarning tashkiliy, ilmiy-texnikaviy, moliyaviy va boshqa faoliyat tomonlari xususida tartib-qoida oʻrnatish maqsadida davlat yoki jamoa boshqaruv organlari tomonidan chiqariladi?","a":"Yoʻriqnoma","i":"Faoliyat tartib-qoidasini belgilovchi huquqiy hujjat ta'rifi.","l":"o","id":1195,"t":1},{"c":"til","s":"r","q":"Xodimning ish faoliyatiga tegishli aksar holatlarni tasdiqlab beradigan hujjat qanday nomlanadi?","a":"Ma'lumotnoma","i":"Xodim faoliyatiga oid holatlarni tasdiqlaydi.","l":"o","id":1196,"t":1},{"c":"til","s":"r","q":"Quyidagi gapda ajratib koʻrsatilgan soʻzlardan nechtasi qoʻshib yoziladi? “Shifokorlarning aytishicha, och//koʻzlik turli kasalliklarga, osh//qozon tizimining buzilishiga, yuzga husn//buzarlar toshishiga olib//keladi”","a":"3 ta: ochkoʻzlik, oshqozon, husnbuzar","i":"olib keladi ajratib yoziladi.","l":"y","id":1197,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi barcha soʻzlar toʻgʻri yozilgan?","a":"Qoida: 1995-yil imlo qoidalari asosida har soʻzni tekshiring (ʼ, x/h, oʻ/u, qoʻshma soʻz)","i":"Variantlar berilmagan.","l":"p","id":1198,"t":0},{"c":"til","s":"r","q":"“Ota-bobolarimiz, momolarimiz bizga yoshligimizdan-oq ozodalik, saranjom-sarishtalik, halollik va harom-harish haqida soʻzlab, pandu nasihatlar bilan ongimizga singdirishga uringanlar.”\"","a":"2 ta xato: yoshligimizdanoq, pand-u","i":"-oq qoʻshib, -u bogʻlovchisi chiziqcha bilan yoziladi.","l":"o","id":1199,"t":1},{"c":"til","s":"r","q":"“Инструктор” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Yoʻriqchi","i":"Инструктор = yoʻriqchi.","l":"y","id":1200,"t":1},{"c":"til","s":"r","q":"Yonma-yon kelgan undoshlardan biri tushirilganda yangi ma’no hosil boʻladigan soʻzlar qatorini belgilang.","a":"Qoida: qoʻsh undoshdan biri tushsa yangi soʻz: kassa–kasa, pilla–pila, olla–ola, chilla–chila, tilla–tila","i":"Variantlar berilmagan.","l":"p","id":1201,"t":0},{"c":"til","s":"r","q":"Muayyan shaxsning xizmat va boshqa holatlarini, biror ishga oid vakolatini koʻrsatuvchi hujjat qanday nomlanadi?","a":"Guvohnoma","i":"Shaxsning holati, vakolatini koʻrsatadi.","l":"o","id":1202,"t":1},{"c":"til","s":"r","q":"Berilgan gapda raqamlar bilan koʻrsatilgan nuqtalar oʻrniga qoʻyiladigan uslubiy jihatdan mos soʻzlarni belgilang. “Mazkur Nizomga (1)... oliy ta’lim muassasalariga qabul barcha uchun teng huquqlilik, yagona qabul qoidalari va yagona tanlov (2)... amalga oshiriladi”.","a":"(1) muvofiq, (2) asosida","i":"Rasmiy uslubdagi turgʻun birikmalar.","l":"y","id":1203,"t":1},{"c":"til","s":"r","q":"“Memorandum” soʻzi bilan ma’nodosh boʻla oladigan soʻzni aniqlang.","a":"Esdalik xati (eslatma nota)","i":"Diplomatik memorandum.","l":"o","id":1204,"t":1},{"c":"til","s":"r","q":"“suyanmoq” soʻzi qaysi javobda asoslanmoq ma’nosida qoʻllangan?","a":"Qoida: «suyanmoq» = asoslanmoq: «Dalillarga suyanib xulosa chiqardi»","i":"Variantlar berilmagan.","l":"p","id":1205,"t":0},{"c":"til","s":"r","q":"\"Tomonlar oʻrtasida ushbu shartnoma boʻyicha yuzaga kelishi mumkin boʻlgan … oʻzaro kelishuv asosida muzokaralar yoʻli bilan … .","a":"nizolar ... hal qilinadi","i":"Shartnomaning nizolarni hal qilish bandi.","l":"y","id":1206,"t":1},{"c":"til","s":"r","q":"Qaysi hujjat diрlomatik yozishmalarga xos emas?","a":"Qoida: diplomatik hujjatlar — nota (shaxsiy, verbal), memorandum, kommyunike, bayonot; buyruq, ariza, dalolatnoma ularga kirmaydi","i":"Variantlar berilmagan.","l":"p","id":1207,"t":0},{"c":"til","s":"r","q":"“Shartnoma ikki yoki undan ortiq tomonni fuqarolik huquqlari va majburiyatlarini belgilash, oʻzgartirish yoki toʻxtatish yoʻlidagi kelishuvidir”. Ushbu gapda qanday xatolik uchraydi?","a":"Kelishik xatosi: «tomonni» oʻrniga «tomonning»","i":"Qaratqich oʻrniga tushum qoʻllangan.","l":"y","id":1208,"t":1},{"c":"til","s":"r","q":"Qaysi javobda koʻp nuqtalar oʻrniga faqat “h” undoshi qoʻyiladi?","a":"Qoida: h — boʻgʻiz tovush (hayot, hunar, ahamiyat, ruh, himoya); x — xalq, faxr, ixlos, baxt","i":"Variantlar berilmagan.","l":"p","id":1209,"t":0},{"c":"til","s":"r","q":"Qaysi gapda uch oʻrinda vergul qoʻyiladi?","a":"Qoida: uyushiq boʻlaklar, kirish soʻz, undalma, qoʻshma gap qismlari, ammo/lekin/chunki oldidan vergulni sanang","i":"Variantlar berilmagan.","l":"p","id":1210,"t":0},{"c":"til","s":"r","q":"Gʻafur Gʻulom yetimlik va moddiy muhtojlikda oʻtgan kunlarini quyidagicha xotirlaydi “Kirmagan eshigim qilmagan xizmatim tutinmagan ishim qolmadi” Ushbu parchada tushirilgan tinish belgilari ketma-ketligi toʻgʻri berilgan javobni aniqlang.","a":"ikki nuqta, qoʻshtirnoq, vergul, vergul, qoʻshtirnoq, nuqta","i":"...xotirlaydi: “Kirmagan eshigim, qilmagan xizmatim, tutinmagan ishim qolmadi”.","l":"o","id":1211,"t":1},{"c":"til","s":"r","q":"“qoʻymoq” soʻzi qaysi javobda duchor qilmoq, yoʻliqtirmoq ma’nosida qoʻllangan?","a":"Qoida: «qoʻymoq» = duchor qilmoq: «Uyatga qoʻydi», «Noqulay ahvolga qoʻydi»","i":"Variantlar berilmagan.","l":"p","id":1212,"t":0},{"c":"til","s":"r","q":"Qaysi gapda ajratib koʻrsatilgan soʻz uslubiy jihatdan toʻgʻri qoʻllangan?","a":"Qoida: soʻz ma'nosi va uslubga mosligi, paronimlar (tadbiq/tatbiq), pleonazm yoʻqligini tekshiring","i":"Variantlar berilmagan.","l":"p","id":1213,"t":0},{"c":"til","s":"r","q":"Tilimizda uzoq vaqtlar “акт” deb atalgan hujjat hozirda qanday nomlanadi?","a":"Dalolatnoma","i":"Акт = dalolatnoma.","l":"y","id":1214,"t":1},{"c":"til","s":"r","q":"Adabiyot atomdan kuchli ammo uning kuchuni oʻtin yorishga sarflamaslik kerak deydi Abdulla Qahhor\"","a":"“Adabiyot atomdan kuchli, ammo uning kuchini oʻtin yorishga sarflamaslik kerak”, – deydi Abdulla Qahhor.","i":"Koʻchirma gap: ammo oldidan vergul, keyin vergul va tire.","l":"o","id":1215,"t":1},{"c":"til","s":"r","q":"Kondensatorlar ketma-ket ulanganda umumiy elektr sigʻimining teskari miqdori har bir kondensator sigʻimining teskari miqdorlari yigʻindisiga teng.\"","a":"Ilmiy uslub","i":"Fizik qonun ta'rifi — atamalar.","l":"y","id":1216,"t":1},{"c":"til","s":"r","q":"“Farmonda davlat tilining hayotimizning barcha jabxalarida toʻla joriy qilinishi uchun chora tadbirlar aniq belgilab berilgan” Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"2 oʻrinda: jabhalarida, chora-tadbirlar","i":"jabxa va chiziqchasiz juft soʻz xato.","l":"y","id":1217,"t":1},{"c":"til","s":"r","q":"\"aпелляция\" soʻzi lotin alifbosidagi imlo qoidalariga koʻra toʻgʻri yozilgan javobni belgilang.","a":"apellyatsiya","i":"Lotin yozuvida ll saqlanadi, я→ya, ц→ts.","l":"y","id":1218,"t":1},{"c":"til","s":"r","q":"“…os chodir eshigiga osilgan kim…ob parda …umoyunning qoʻliga mayin va o…ista tegdi”. Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “x” qoʻllanadi?","a":"2 ta: Xos, kimxob","i":"Humoyun, ohista — h.","l":"o","id":1219,"t":1},{"c":"til","s":"r","q":"Hujjatlarni saqlovchi “дело” soʻzining oʻzbek tilidagi tarjimasi berilgan javobni aniqlang.","a":"Yigʻmajild (ish)","i":"Дело — hujjatlar yigʻmajildi.","l":"o","id":1220,"t":1},{"c":"til","s":"r","q":"Qaysi gapda “qoʻymoq” fe’li namoyish qilmoq, koʻrsatmoq ma’nosida qoʻllangan?","a":"Qoida: «qoʻymoq» = namoyish qilmoq: «Teatr yangi spektakl qoʻydi», «Koʻrgazmaga qoʻydi»","i":"Variantlar berilmagan.","l":"p","id":1221,"t":0},{"c":"til","s":"r","q":"Qaysi javobda har uchala soʻzdagi nuqtalar oʻrnida “x” undoshi yoziladi?","a":"Qoida: x — xalq, xat, faxr, ixlos, baxt, tarix; h — hayot, hunar, ruh, ahamiyat","i":"Variantlar berilmagan.","l":"p","id":1222,"t":0},{"c":"til","s":"r","q":"Alisher Navoiy Til shuncha qudrati bilan nutqning qurolidir deydi\"","a":"Alisher Navoiy: “Til shuncha qudrati bilan nutqning qurolidir”, – deydi.","i":"Muallif gapi ichida koʻchirma: tirnoq, vergul, tire.","l":"p","id":1223,"t":0},{"c":"til","s":"r","q":"“Avgʻonistondagi qarama-qarshilik¬ning dunyo miqyosida kelib chiqishi mumkun boʻlgan havfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"2 oʻrinda: mumkin, xavfli","i":"Afgʻoniston, qarama-qarshilik toʻgʻri.","l":"y","id":1224,"t":1},{"c":"til","s":"r","q":"Farmoyish hujjatlari nomi berilgan javobni belgilang.","a":"Farmon, qaror, buyruq, farmoyish, koʻrsatma","i":"Farmoyish hujjatlari guruhi.","l":"o","id":1225,"t":1},{"c":"til","s":"r","q":"\"Ushbu gapda chiqmoq fe’li qaysi ma’noda qoʻllangan?","a":"topilmoq","i":"Yoʻqolgan narsa topildi ma'nosi.","l":"y","id":1226,"t":1},{"c":"til","s":"r","q":"Yoʻqolgan hamyon shkafdagi kiyimlar orasidan chiqdi. \"","a":"«chiqmoq» — topilmoq ma'nosida","i":"84-savol gapi.","l":"y","id":1227,"t":1},{"c":"til","s":"r","q":"Oilaviy baxtda hikmat koʻp deb yozadi Abdulla Qahhor\"","a":"“Oilaviy baxtda hikmat koʻp”, – deb yozadi Abdulla Qahhor.","i":"Koʻchirma gap muallif gapidan oldin.","l":"o","id":1228,"t":1},{"c":"til","s":"r","q":"Nuqtalar oʻrniga “u” unlisi qoʻyiladigan soʻzlar qatorini belgilang.","a":"Qoida: u — mukofot, mutolaa, muhim, burgut, kumush; oʻ — boʻron, koʻmak; arabcha soʻzlarda u koʻp","i":"Variantlar berilmagan.","l":"p","id":1229,"t":0},{"c":"til","s":"r","q":"“yurmoq” soʻzi qaysi javobda birga boʻlmoq ma’nosida qoʻllangan?","a":"Qoida: «yurmoq» = birga boʻlmoq, doʻstlashmoq: «U Anvar bilan yuradi»","i":"Variantlar berilmagan.","l":"p","id":1230,"t":0},{"c":"til","s":"r","q":"\"Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim? “Tadbir bir necha tashkilotlar tomonidan uyushtirilsa taklif qiluvchilar nomi matnda alohida-alohida koʻrsatiladi lekin taklifnoma soʻngida imzo oʻrnida tadbirni tashkil etuvchilarni koʻrsatish shart emas.”","a":"2 oʻrinda: uyushtirilsa, ... koʻrsatiladi, lekin","i":"Shart ergash gap va lekin oldidan vergul.","l":"y","id":1231,"t":1},{"c":"til","s":"r","q":"“Korrektor” soʻzi bilan ma’nodosh boʻla oladigan soʻzni aniqlang.","a":"Musahhih","i":"Korrektor = musahhih.","l":"y","id":1232,"t":1},{"c":"til","s":"r","q":"Quyidagi gapda ajratib koʻrsatilgan soʻzlarning imlosi toʻgʻri koʻrsatilgan javobni belgilang. “Bir//necha asrlar mobaynida Markaziy//Osiyoning erk//sevar xalqi dushmanga qarshi mardlarcha kurashdi”","a":"bir necha, Markaziy Osiyo, erksevar","i":"Birinchi ikkisi ajratib, erksevar qoʻshib.","l":"y","id":1233,"t":1},{"c":"til","s":"r","q":"“…ozirgi kunda milliy …alq …unarmandchiligiga katta a…amiyat berilmoqda”.Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “h” qoʻllanadi?","a":"3 ta: hozirgi, hunarmandchiligiga, ahamiyat","i":"xalq — x bilan.","l":"y","id":1234,"t":1},{"c":"til","s":"r","q":"Xodim xizmat safari yakuni haqida rahbarga ma’lumot beradigan hujjat qanday nomlanadi?","a":"Hisobot (xizmat safari hisoboti)","i":"Safar yakuni haqida rahbarga.","l":"y","id":1235,"t":1},{"c":"til","s":"r","q":"“Tarix haqiqati shuni koʻrsatadiki tomirida milliy gʻurur Vatan ishqi joʻsh urgan odamgina buyuk ishlarga qodir boʻladi”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"2 oʻrinda: koʻrsatadiki, ... gʻurur, Vatan ishqi","i":"-ki dan keyin va uyushiq egalar orasida.","l":"y","id":1236,"t":1},{"c":"til","s":"r","q":"Huquqiy qonunchilik va ish yuritish munosabatlari doirasida qoʻllaniluvchi nutq uslubi qanday ataladi?","a":"Rasmiy (rasmiy-idoraviy) uslub","i":"Qonunchilik va ish yuritish doirasi.","l":"y","id":1237,"t":1},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda his qilmoq, chekmoq ma’nosida qoʻllangan?","a":"Qoida: «tortmoq» = his qilmoq, chekmoq: «Azob tortdi», «Jabr tortdi», «Ozor tortdi»","i":"Variantlar berilmagan.","l":"p","id":1238,"t":0},{"c":"til","s":"r","q":"Qaysi uslubda “muxbirimiz xabar berishicha”, “… xodimining soʻziga koʻra”, “muxbirimiz voqea roʻy bergan joydan xabar beradi” kabi birliklar qoʻllanadi?","a":"Publitsistik uslub","i":"Ommaviy axborot vositalari birliklari.","l":"y","id":1239,"t":1},{"c":"til","s":"r","q":"Qaysi javobda ishonchnomaga xos xususiyat berilgan?","a":"Qoida: ishonchnoma — bir shaxsga boshqasi nomidan ish koʻrish vakolatini beradi; vakil, vakolat, muddat, imzo tasdigʻi","i":"Variantlar berilmagan.","l":"p","id":1240,"t":0},{"c":"til","s":"r","q":"Tilimizda uzoq vaqtlar “рапорт” deb atalgan hujjat hozirda qanday nomlanadi?","a":"Bildirishnoma","i":"Рапорт/докладная — rahbarga bildirishnoma.","l":"o","id":1241,"t":1},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda tarozida oʻlchamoq ma’nosida qoʻllangan?","a":"Qoida: «tortmoq» = tarozida oʻlchamoq: «Sotuvchi goʻshtni tortdi»","i":"Variantlar berilmagan.","l":"p","id":1242,"t":0},{"c":"til","s":"r","q":"Qaysi javobda har ikkala soʻzdagi nuqtalar oʻrnida “x” undoshi yoziladi?","a":"Qoida: x — xalq, xat, faxr, ixlos, tarix, baxt; h — hayot, hunar, ruh","i":"Variantlar berilmagan.","l":"p","id":1243,"t":0},{"c":"til","s":"r","q":"Hujjatning qaysi zaruriy qismi “rezolyutsiya” deb ham nomlanadi?","a":"Rahbar koʻrsatmasi (ijro yuzasidan qayd)","i":"Rezolyutsiya — rahbarning koʻrsatmasi.","l":"y","id":1244,"t":1},{"c":"til","s":"r","q":"Qoʻshib yoziladigan soʻzlar berilgan javobni aniqlang.","a":"Qoida: qoʻshma soʻzlar qoʻshib yoziladi: erksevar, sheryurak, ochkoʻz, oshqozon, husnbuzar; «bir necha», «olib kelmoq» ajratib","i":"Variantlar berilmagan.","l":"p","id":1245,"t":0},{"c":"til","s":"r","q":"“Afsuski koʻp hollarda xalq bilan mana shu boy chiroyli qudratli tilimizda gaplashishmaydi”. Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"3 oʻrinda: Afsuski, ... boy, chiroyli, qudratli","i":"Kirish soʻz va uyushiq aniqlovchilar.","l":"y","id":1246,"t":1},{"c":"til","s":"r","q":"Bildirishnoma zaruriy qismlarining joylashuvi, shakliga koʻra qaysi hujjatga oʻxshash boʻladi?","a":"Ariza","i":"Shakl va rekvizitlar joylashuvi arizaga oʻxshaydi.","l":"o","id":1247,"t":1},{"c":"til","s":"r","q":"\"Ushbu parchada nechta imloviy xatolik uchraydi? “Ota-bobolarimiz, momolarimiz bizga yoshligimizdanoq ozodalik, saramjon-sarishtalik, halollik va harom-harish haqida soʻzlab, pand-u nasihatlar bilan ongimizga singdirishga urunganlar.”","a":"2 ta: saranjom, uringanlar","i":"yoshligimizdanoq va pand-u toʻgʻri.","l":"o","id":1248,"t":1},{"c":"til","s":"r","q":"\"Ushbu gapdagi nuqtalar oʻrniga qoʻyilishi lozim boʻlgan qoʻshimchalar ketma-ketligi toʻgʻri berilgan javobni aniqlang.","a":"-ga, -ning, -ni, -ning, -ni","i":"xodimga uning daftarchasini va shartnomasining ... nusxasini.","l":"o","id":1249,"t":1},{"c":"til","s":"r","q":"“Mehnat shartnomasi bekor qilingan kuni ma’muriyat xodim… u… mehnat daftarchasi… va mehnat shartnomasi… bekor qilinishi haqidagi buyruq nusxasi… berishi shart.”\"","a":"xodimga, uning, daftarchasini, shartnomasining, nusxasini","i":"107-savol gapi.","l":"o","id":1250,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi parcha tavsiyanoma matniga tegishli emas?","a":"Qoida: tavsiyanoma — shaxsni ishga/oʻqishga tavsiya qiladi («...ni ... lavozimiga tavsiya etaman»); boshqa hujjat iborasi bor variant","i":"Variantlar berilmagan.","l":"p","id":1251,"t":0},{"c":"til","s":"r","q":"Qaysi javobda ishonchnoma matniga tegishli parcha berilgan?","a":"Qoida: ishonchnoma matni: «Men, ..., ... ga ... olish uchun ishonch bildiraman», muddat, imzo tasdigʻi","i":"Variantlar berilmagan.","l":"p","id":1252,"t":0},{"c":"til","s":"r","q":"“Zamonaviy talab va didga moslab oʻzgartirish”. Ushbu izoh berilgan soʻzlardan qaysi biriga mos?","a":"Modernizatsiya (zamonaviylashtirish)","i":"Zamon talabiga moslab yangilash.","l":"o","id":1253,"t":1},{"c":"til","s":"r","q":"“bermoq” soʻzi qaysi javobda baxsh etmoq ma’nosida qoʻllangan?","a":"Qoida: «bermoq» = baxsh etmoq: «Tabiat unga iste'dod bergan», «Quvonch berdi»","i":"Variantlar berilmagan.","l":"p","id":1254,"t":0},{"c":"til","s":"r","q":"Daraxtlarning zarrin barglari toʻkilib tugalgan, yer yuzi oʻzining qishki kumushrang toʻnini kiygan edi. Ushbu parcha qaysi uslubga xosligini belgilang.","a":"Badiiy uslub","i":"Tasviriy vositalar: zarrin barg, kumushrang toʻn.","l":"y","id":1255,"t":1},{"c":"til","s":"r","q":"“OʻzR Fuqarolik kodeksining 1135- va 1146-moddalariga muvofiq, bizga teng ulushlarda merosga egalik huquqi toʻgʻrisida guvohnoma berishingizni soʻrayman”. \"","a":"Ariza","i":"«...berishingizni soʻrayman» — ariza matni.","l":"y","id":1256,"t":1},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda tarqatmoq ma’nosida qoʻllangan?","a":"Qoida: «tortmoq» = tarqatmoq, ulashmoq: «Mehmonlarga osh tortildi»","i":"Variantlar berilmagan.","l":"p","id":1257,"t":0},{"c":"til","s":"r","q":"\"Ushbu gapda // belgisi oʻrnida qaysi tinish belgisi qoʻyilishi kerak?","a":"Tire: Mard bir oʻlar, nomard – ming.","i":"Tushirilgan kesim oʻrnida tire.","l":"y","id":1258,"t":1},{"c":"til","s":"r","q":"Mard bir oʻlar, nomard // ming. \"","a":"Tire","i":"116-savol gapi.","l":"y","id":1259,"t":1},{"c":"til","s":"r","q":"Qaysi uslubda atama, ta’riﬂar, qoidalar faol qoʻllanadi?","a":"Ilmiy uslub","i":"Atama, ta'rif, qoidalar.","l":"y","id":1260,"t":1},{"c":"til","s":"r","q":"Tashkiliy hujjatlar nomi berilgan javobni belgilang.","a":"Nizom, ustav, yoʻriqnoma, shtat jadvali","i":"Tashkiliy hujjatlar.","l":"o","id":1261,"t":1},{"c":"til","s":"r","q":"Davrning eng muhim, dolzarb masalalarini oʻquvchilarga, tinglovchilarga, tomoshabinlarga OAV vositalari orqali yetkazish, ommani jonlan¬tirish, kishilarning ongiga atrofda sodir boʻlayotgan voqealarni singdirish, ularning ijtimoiy qarashlarini shakllantirish uchun xizmat qiladigan uslub qanday ataladi?","a":"Publitsistik uslub","i":"OAV orqali ommani jonlantirish.","l":"y","id":1262,"t":1},{"c":"til","s":"r","q":"Taraflarning javobgarligi va nizolarni hal qilish tartibi qaysi hujjatda bayon qilinadi?","a":"Shartnoma","i":"Javobgarlik va nizolar bandi.","l":"y","id":1263,"t":1},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga “u” unlisi qoʻyiladi?","a":"Qoida: u — mukofot, mutolaa, muhim, kumush, burgut; oʻ bilan adashtirmang","i":"Variantlar berilmagan.","l":"p","id":1264,"t":0},{"c":"til","s":"r","q":"Voqea shu qadar tez sodir boʻldiki // hech birimiz tushunishga ulgurmadik.","a":"Vergul: ...sodir boʻldiki, hech birimiz...","i":"-ki dan keyin vergul.","l":"y","id":1265,"t":1},{"c":"til","s":"r","q":"“Yoʻl harakati qoidalarining buzgan shaxsga nisbatan DYHXX xodimi huquqbuzarlik sodir etilgan joyni oʻzida bayonnoma rasmiylashtirilishi shart”. Ushbu gapda qoʻshimchaning nooʻrin qoʻllanishi necha oʻrinda uchraydi?","a":"2 oʻrinda: qoidalarini, joyning","i":"«qoidalarining» va «joyni» xato.","l":"y","id":1266,"t":1},{"c":"til","s":"r","q":"“Ichki mehnat tartiboti qoidalari mukofotlash nizomi va shu kabilarni tasdiqlash bilan bogʻliq me’yoriy buyruqlar ham asosiy faoliyatga oid buyruqlar sirasiga kiradi.” \"","a":"1 oʻrinda vergul: ...qoidalari, mukofotlash nizomi...","i":"Uyushiq toʻldiruvchilar orasida.","l":"o","id":1267,"t":1},{"c":"til","s":"r","q":"Tashkiliy hujjat nomi berilgan javobni belgilang.","a":"Nizom (ustav, yoʻriqnoma, shtat jadvali)","i":"Tashkiliy hujjat.","l":"o","id":1268,"t":1},{"c":"til","s":"r","q":"“Рецензия” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Taqriz","i":"Рецензия = taqriz.","l":"y","id":1269,"t":1},{"c":"til","s":"r","q":"Hujjat rasmiylashtirish qoidalariga asoslangan holda quyidagi jumlada nuqtalar oʻrniga qoʻyiladigan toʻgʻri javobni belgilang. “Bayonnomada oʻz aksini topgan axborotlarning aniqligi uchun butun mas’uliyat ... zimmasiga yuklatiladi.”","a":"rais va kotib","i":"Bayonnomani ular imzolaydi va javob beradi.","l":"y","id":1270,"t":1},{"c":"til","s":"r","q":"Muayyan xodimni mehnat ta’tiliga chiqarish uchun qanday hujjat rasmiylashtiriladi?","a":"Buyruq (shaxsiy tarkib boʻyicha)","i":"Ta'til xodim arizasi asosida buyruq bilan.","l":"y","id":1271,"t":1},{"c":"til","s":"r","q":"“yutmoq” soʻzi qaysi javobda naf koʻrmoq ma’nosida qoʻllangan?","a":"Qoida: «yutmoq» = naf koʻrmoq: «Bu savdodan u koʻp yutdi»","i":"Variantlar berilmagan.","l":"p","id":1272,"t":0},{"c":"til","s":"r","q":"Ushbu parcha qaysi hujjat matnidan namuna hisoblanadi? “Men, D.A.Rahimova, 2024-yilning 10–15-fevral kunlarida Yangiyoʻl shahrining “Lazzat” birlashmasida xizmat safarida boʻldim”.","a":"Hisobot (xizmat safari hisoboti)","i":"Safar haqida I shaxsda.","l":"y","id":1273,"t":1},{"c":"til","s":"r","q":"Qaysi javobda bayonnomaning zaruriy qismlari berilgan?","a":"Qoida: nom, sana, raqam, joy, rais/kotib/qatnashuvchilar, kun tartibi, Eshitildi–Soʻzga chiqdilar–Qaror qilindi, imzolar","i":"Variantlar berilmagan.","l":"p","id":1274,"t":0},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga \"o\" unlisi qoʻyiladi?","a":"Qoida: o — ota, bola, boʻgʻinda «a» tovushi; oʻ bilan adashtirmang (qol–qoʻl, tor–toʻr)","i":"Variantlar berilmagan.","l":"p","id":1275,"t":0},{"c":"til","s":"r","q":"Qaysi javobda dalolatnomaga xos xususiyat berilgan?","a":"Qoida: dalolatnoma bir necha kishi (komissiya) tomonidan tuziladi, holatni tasdiqlaydi, hammasi imzolaydi","i":"Variantlar berilmagan.","l":"p","id":1276,"t":0},{"c":"til","s":"r","q":"Quyidagi gapda belgilab koʻrsatilgan soʻzlardan nechtasi qoʻshib yoziladi? “Bir//necha asrlar mobaynida Markaziy//Osiyoning erk//sevar, sher//yurak xalqi dushmanga qarshi mardlarcha kurashdi”","a":"2 ta: erksevar, sheryurak","i":"bir necha, Markaziy Osiyo ajratib.","l":"y","id":1277,"t":1},{"c":"til","s":"r","q":"Qaysi javobda quyidagi birlikning qisqartmasi toʻgʻri berilgan? “Oʻzbekiston Respublikasi Markaziy banki”","a":"OʻzR Markaziy banki (OʻzR MB)","i":"Respublika qisqartmasi OʻzR.","l":"o","id":1278,"t":1},{"c":"til","s":"r","q":"Ariza uchun xos boʻlmagan rekvizit (tarkibiy qism)ni aniqlang.","a":"Qoida: ariza rekvizitlari — adresat, adresant, nom, matn, ilova, sana, imzo; muhr, gerb, tasdiq ustxati xos emas","i":"Variantlar berilmagan.","l":"p","id":1279,"t":0},{"c":"til","s":"r","q":"Ma’lum bir shaxsning boshqa shaxs nomidan ish koʻrishi uchun vakolat beradigan hujjat qanday nomlanadi?","a":"Ishonchnoma","i":"Vakolat beruvchi hujjat.","l":"y","id":1280,"t":1},{"c":"til","s":"r","q":"Qaysi javobda shartnomaga xos xususiyat berilgan?","a":"Qoida: shartnoma — 2+ tomon kelishuvi; huquq-majburiyatlar, muddat, javobgarlik, nizolar, rekvizitlar, imzo-muhr","i":"Variantlar berilmagan.","l":"p","id":1281,"t":0},{"c":"til","s":"r","q":"Qaysi hujjatda “Eshitildi”, “Soʻzga chiqdilar”, “Qaror qilindi” deb nomlangan zaruriy qismlar mavjud?","a":"Bayonnoma","i":"Eshitildi, Soʻzga chiqdilar, Qaror qilindi.","l":"y","id":1282,"t":1},{"c":"til","s":"r","q":"“Vatanni …imoya qilganlar yurtning asl suyanch togʻidir. Avlodlar ularning nomini fa…r bilan tilga oladilar. Ularning qa…ramonliklariga i…los qiladilar, chunki ular Vatanga ru…i bilan qorishib ketganlar.” \"","a":"h: himoya, qahramonlik, ruhi (3); x: faxr, ixlos (2)","i":"Savol berilmagan; ikkala sanoq.","l":"o","id":1283,"t":1},{"c":"til","s":"r","q":"“Rasmiy xat – vazirliklar, elchixonalar, vakolatxonalar oʻrtasidagi yozishma boʻlib, biror mansabdor shaxs nomida yoziladi.”\"","a":"Shaxsiy nota","i":"Mansabdor shaxs nomidan yoziladigan diplomatik yozishma.","l":"p","id":1284,"t":0},{"c":"til","s":"r","q":"Hujjat rasmiylashtirish qoidalariga asoslangan holda quyidagi jumlada nuqtalar oʻrniga qoʻyiladigan toʻgʻri javobni belgilang. “Arizamga 25-oktabr kuni shifokor qabulida boʻlganimni tasdiqlovchi 5-shahar shifoxonasidan berilgan ... ilova qilindi.”","a":"ma'lumotnoma","i":"Shifoxona beradigan tasdiqlovchi hujjat.","l":"y","id":1285,"t":1},{"c":"til","s":"r","q":"Chiziqcha toʻgʻri qoʻllangan javobni belgilang.","a":"Qoida: chiziqcha — juft/takroriy soʻzlar (ota-ona), -u/-yu (aql-u), tartib son (5-sinf), sana; -oq, -ki qoʻshib","i":"Variantlar berilmagan.","l":"p","id":1286,"t":0},{"c":"til","s":"r","q":"Hujjat rasmiylashtirish qoidalariga asoslangan holda quyidagi jumlani toʻgʻri yakunlang. “Hujjat joʻnatiladigan yuqori idora yoki mansabdor shaxsning nomi bosma ish qogʻozining ...”","a":"yuqori oʻng burchagiga yoziladi","i":"Adresat rekviziti joyi.","l":"o","id":1287,"t":1},{"c":"til","s":"r","q":"Qaysi hujjatda “Buyurtmachi” – “Ijrochi” tomonlarning huquq va majburiyatlari bayon qilinadi?","a":"Shartnoma","i":"Buyurtmachi–Ijrochi tomonlari.","l":"y","id":1288,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi soʻzlarda qoʻshimcha qoʻshilishi bilan bogʻliq imloviy xatolikka yoʻl qoʻyilgan?","a":"Qoida: koʻp boʻgʻinli k/q → g/gʻ (yuragi, qishlogʻi), unli tushishi (burni, oʻgʻli), -ga→-ka/-qa (tokka, qishloqqa)","i":"Variantlar berilmagan.","l":"p","id":1289,"t":0},{"c":"til","s":"r","q":"“Oʻzini kimgadir yaqin koʻrsatib, uning xayrixohligidan shaxsiy manfaati yoʻlida foydalanmoq” ma’nosini anglatuvchi iborani aniqlang.","a":"pinjiga kirmoq","i":"Yaqin koʻrinib manfaat koʻzlash.","l":"o","id":1290,"t":1},{"c":"til","s":"r","q":"“Tomonlar axborot xavfsizligini ta’minlash; kiberjinoyatchilikka qarshi kurashishda hamkorlikni kengaytirishga kelishib oldilar.”\"","a":"Nuqtali vergul oʻrniga vergul: ta'minlash, kiberjinoyatchilikka...","i":"Uyushiq boʻlaklar vergul bilan.","l":"y","id":1291,"t":1},{"c":"til","s":"r","q":"“Ma’lum bir muassasaning boshqa bir idora yoki transport tashkilotlariga nisbatan talab, e’tirozlari bayon qilingan xatlar davo xatlari deb yuritiladi.” \"","a":"Imlo xatosi: «davo» oʻrniga «da'vo xatlari»","i":"Tutuq belgisi tushib qolgan.","l":"y","id":1292,"t":1},{"c":"til","s":"r","q":"Ushbu parchada nechta imloviy xatolik uchraydi? “Ota-bobolarimiz, momolarimiz bizga yoshligimizdanoq ozodalik, saranjom-sarishtalik, halollik va harom-harish haqida soʻzlab, pand-u nasixatlar bilan ongimizga singdirishga uringanlar.”","a":"1 ta: nasihatlar","i":"«nasixatlar» xato; qolgani toʻgʻri.","l":"o","id":1293,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi hujjat diplomatik yozishmalarga mansub emas?","a":"Qoida: diplomatik — nota, memorandum, kommyunike, bayonot; buyruq, ariza, dalolatnoma emas","i":"Variantlar berilmagan.","l":"p","id":1294,"t":0},{"c":"til","s":"r","q":"Amir Temur shunday deydi Bir kunlik adolat yuz kunlik ibodat bilan tengdur\"","a":"Amir Temur shunday deydi: “Bir kunlik adolat yuz kunlik ibodat bilan tengdur.”","i":"Muallif gapidan keyin ikki nuqta va qoʻshtirnoq.","l":"o","id":1295,"t":1},{"c":"til","s":"r","q":"Qaysi uslubda ijtimoiy dolzarb masalalarga hozirjavobligi tufayli ijtimoiy-siyosiy tushunchalarni ifoda­lovchi soʻzlar koʻproq qoʻllaniladi?","a":"Publitsistik uslub","i":"Ijtimoiy-siyosiy soʻzlar.","l":"y","id":1296,"t":1},{"c":"til","s":"r","q":"“Order” soʻzi bilan ma’nodosh boʻla oladigan soʻzni aniqlang.","a":"Yoʻllanma (ruxsatnoma)","i":"Order — biror narsa olishga huquq beruvchi hujjat.","l":"p","id":1297,"t":0},{"c":"til","s":"r","q":"Hujjatning qaysi zaruriy qismi “viza” deb ham nomlanadi?","a":"Kelishuv belgisi (vizalash)","i":"Viza — hujjatni kelishish belgisi.","l":"o","id":1298,"t":1},{"c":"til","s":"r","q":"“qolmoq” soʻzi qaysi javobda barham topmoq, yoʻq boʻlmoq ma’nosida qoʻllangan?","a":"Qoida: «qolmoq» = barham topmoq: «Yomgʻir qoldi», «Ogʻrigʻi qoldi», «Eski odat qoldi»","i":"Variantlar berilmagan.","l":"p","id":1299,"t":0},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga \"f\" undoshi qoʻyiladi?","a":"Qoida: f — fan, fikr, faxr, sifat, afzal; p bilan adashtirmang","i":"Variantlar berilmagan.","l":"p","id":1300,"t":0},{"c":"til","s":"r","q":"Qor yog’di // don yogʻdi.\"","a":"Tire: Qor yogʻdi – don yogʻdi.","i":"Natija ma'nosidagi bogʻlovchisiz qoʻshma gap.","l":"y","id":1301,"t":1},{"c":"til","s":"r","q":"Barchasi ayon boʻldi // bu ishlarda ham uning ishtiroki bor ekan.\"","a":"Ikki nuqta: Barchasi ayon boʻldi: bu ishlarda...","i":"Ikkinchi qism birinchini izohlaydi.","l":"y","id":1302,"t":1},{"c":"til","s":"r","q":"Qaysi ibora “ogʻzining tanobi qochmoq” iborasiga ma’nodosh boʻla olmaydi?","a":"Qoida: ma'nodoshlari — boshi osmonga yetmoq, terisiga sigʻmaslik, doʻppisini osmonga otmoq; qaygʻu/gʻazab iborasi ma'nodosh emas","i":"Variantlar berilmagan.","l":"p","id":1303,"t":0},{"c":"til","s":"r","q":"Ushbu parcha qaysi uslubga xosligini aniqlang. Quyosh qayerdadir togʻ ortidan, qayerdadir choʻl adogʻidan, qayerdadir asriy muzlar orasidan bosh koʻtaradi. Qayerdadir daraxt kokillarini oʻynab, billuriy buloq suvlariga toʻyib olgach, xonadonlarga moʻralaydi.","a":"Badiiy uslub","i":"Jonlantirish, tasviriy vositalar.","l":"y","id":1304,"t":1},{"c":"til","s":"r","q":"Berilgan gapda nuqtalar oʻrniga qoʻyiladigan uslubiy jihatdan mos soʻzni belgilang. “Sizning 615-sonli murojaatingizni ... yuzasidan quyidagilarni ma’lum qilamiz.”","a":"koʻrib chiqish","i":"«murojaatni koʻrib chiqish yuzasidan» — rasmiy birikma.","l":"o","id":1305,"t":1},{"c":"til","s":"r","q":"“tushmoq” soʻzi qaysi javobda ilinm const NBITS = DATA.length;
function b64u(bytes){ let s=''; bytes.forEach(b=>s+=String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64u(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return Uint8Array.from(bin, c=>c.charCodeAt(0)); }
function setToBits(obj){ const a=new Uint8Array(Math.ceil(NBITS/8)); for(const k in obj){ const i=+k; if(i>=0&&i<NBITS) a[i>>3]|=1<<(i&7); } let n=a.length; while(n>0&&a[n-1]===0) n--; return b64u(a.slice(0,n)); }
function bitsToSet(s){ const o={}; if(!s) return o; const a=unb64u(s); for(let i=0;i<a.length*8&&i<NBITS;i++) if(a[i>>3]&(1<<(i&7))) o[i]=1; return o; }
function makeSyncCode(){
  const h = ST.hist.slice(-30).map(x=>x.p.toString(36)+'-'+Math.round(x.d/60000).toString(36)).join('_');
  return ['v1', setToBits(ST.known), setToBits(ST.again), setToBits(ST.wrong), h].join('.');
}
function applySyncCode(code){
  code = (code||'').trim();
  const m = code.match(/[#&?]s=([^\s&]+)/); if (m) code = decodeURIComponent(m[1]);
  const p = code.split('.'); if (p[0]!=='v1' || p.length<5) throw new Error('kod');
  const K=bitsToSet(p[1]), A=bitsToSet(p[2]), W=bitsToSet(p[3]);
  const before = Object.keys(ST.known).length;
  Object.assign(ST.known, K);
  for (const k in A) if (!ST.known[k]) ST.again[k]=1;
  for (const k in ST.known) delete ST.again[k];
  for (const k in W) ST.wrong[k] = Math.max(ST.wrong[k]||0, 1);
  if (p[4]) { const seen=new Set(ST.hist.map(x=>Math.round(x.d/60000)));
    p[4].split('_').forEach(t=>{ const [pp,dd]=t.split('-'); const d=parseInt(dd,36); if(!seen.has(d)){ ST.hist.push({p:parseInt(pp,36), d:d*60000}); seen.add(d);} });
    ST.hist.sort((a,b)=>a.d-b.d); if (ST.hist.length>50) ST.hist = ST.hist.slice(-50); }
  save();
  return Object.keys(ST.known).length - before;
}

const pick = (arr, n) => shuffle(arr).slice(0, n);

const toks = s => new Set(s.toLowerCase().replace(/[^a-zа-яёʻʼ0-9 ]+/gi,' ').split(/\s+/).filter(w=>w.length>4 && !STOP.has(w)).map(w=>w.slice(0,6)));

function overlap(a,b){ let n=0; for (const w of a) if (b.has(w)) n++; return n; }

/* ---------- variantlar generatori ---------- */
const YESNO = ['Ha','Yoʻq','Faqat qonunda nazarda tutilgan hollarda','Faqat rahbarning yozma ruxsati bilan'];
function feat(s){ return {num:/\d/.test(s), len:s.length, yn:/^(ha|yoʻq|yo'q)\b/i.test(s)}; }
function makeOptions(item){
  if (item.o) return shuffle(item.o).map(t=>({t, ok: t===item.a}));
  const f = feat(item.a);
  let d = [];
  if (f.yn) d = YESNO.filter(x=>!item.a.toLowerCase().startsWith(x.toLowerCase())).slice(0,3);
  if (d.length<3){
    const fromCats = item.c==='oddiy' ? ['oddiy','qonun'] : (item.c==='qonun' ? ['qonun','oddiy'] : [item.c]);
    const pool = testable.filter(x=>fromCats.includes(x.c) && x.id!==item.id && !x.o);
    const seen = new Set([normA(item.a), ...d.map(normA)]);
    const cands = pick(pool, 260).map(x=>{
      const g = feat(x.a);
      let sc = (g.num===f.num?0:3) + Math.abs(g.len-f.len)/Math.max(g.len,f.len,1)*2.2 + (x.c===item.c?0:0.6) - Math.min(overlap(item._t,x._t),3)*0.7 + Math.random()*0.9;
      return {t:x.a, sc};
    }).sort((a,b)=>a.sc-b.sc);
    for (const c of cands){ const k=normA(c.t); if (!seen.has(k) && k.length>0){ seen.add(k); d.push(c.t); if (d.length>=3) break; } }
  }
  return shuffle([{t:item.a, ok:true}, ...d.slice(0,3).map(t=>({t, ok:false}))]);
}

}
function modal(t, body, okText, onOk, cancelText='Bekor qilish'){
  $modal.innerHTML = `<div class="modal" onclick="if(event.target===this)closeModal()"><div class="box"><h3>${t}</h3><div class="muted">${body}</div><div class="row"><button class="btn" onclick="closeModal()">${cancelText}</button><button class="btn pri" id="mok">${okText}</button></div></div></div>`;
  document.getElementById('mok').onclick = ()=>{ closeModal(); onOk(); };
}
function closeModal(){ $modal.innerHTML=''; }

/* ---------- YODLASH ---------- */
let L = { cat: 'oddiy', filter:'all', view:'card', reveal:true, order:'seq', q:'', list:[], idx:0, shown:false, page:0 };
Object.assign(L, ST.prefs.learn||{});
function learnBuild(){
  let a = byCat(L.cat);
  if (L.filter==='new') a = a.filter(d=>!ST.known[d.id]);
  if (L.filter==='again') a = a.filter(d=>ST.again[d.id]);
  if (L.filter==='known') a = a.filter(d=>ST.known[d.id]);
  if (L.q.trim()){ const q=L.q.trim().toLowerCase(); a = a.filter(d=>(d.q+' '+d.a).toLowerCase().includes(q)); }
  if (L.order==='rand') a = shuffle(a);
  L.list = a; if (L.idx>=a.length) L.idx = 0;
}
function learnSavePrefs(){ ST.prefs.learn = {cat:L.cat, filter:L.filter, view:L.view, reveal:L.reveal, order:L.order}; ST.pos[L.cat+'|'+L.filter] = L.idx; save(); }
function setL(k,v){ L[k]=v; if (k!=='idx'){ if(k==='cat'||k==='filter'){ L.idx = ST.pos[L.cat+'|'+L.filter]||0; } L.page=0; learnBuild(); } L.shown=false; learnSavePrefs(); rLearn(); }
function rLearn(){
  if (!L.list.length && !L._built){ L._built=true; L.idx = ST.pos[L.cat+'|'+L.filter]||0; learnBuild(); }
  const counts = Object.fromEntries(CATS.map(c=>[c.k, byCat(c.k).length]));
  const head = `
  <div class="top"><button class="back" onclick="go('home')">←</button><h1>📖 Yodlash</h1></div>
  <div class="chips">${CATS.map(c=>`<button class="chip ${L.cat===c.k?'on':''}" onclick="setL('cat','${c.k}')">${c.ic} ${c.n}<small>${counts[c.k]}</small></button>`).join('')}</div>
  <div class="tools">
    <div class="seg">${[['all','Hammasi'],['new','Yodlanmagan'],['again','Takrorlash'],['known','Bildim']].map(([k,n])=>`<button class="${L.filter===k?'on':''}" onclick="setL('filter','${k}')">${n}</button>`).join('')}</div>
    <div class="seg">
      <button class="${L.view==='card'&&L.reveal?'on':''}" onclick="L.view='card';setL('reveal',true)">Javob ochiq</button>
      <button class="${L.view==='card'&&!L.reveal?'on':''}" onclick="L.view='card';setL('reveal',false)">Oʻzim oʻylayman</button>
      <button class="${L.view==='list'?'on':''}" onclick="setL('view','list')">Roʻyxat</button>
    </div>
  </div>
  <div class="tools">
    <input class="search" placeholder="🔍 Savol yoki javobdan qidirish..." value="${esc(L.q)}" oninput="L.q=this.value;L.idx=0;L.page=0;learnBuild();clearTimeout(window._st);window._st=setTimeout(()=>{rLearn();const s=document.querySelector('.search');s.focus();s.setSelectionRange(s.value.length,s.value.length)},250)">
    <div class="seg"><button class="${L.order==='seq'?'on':''}" onclick="setL('order','seq')">Tartib bilan</button><button class="${L.order==='rand'?'on':''}" onclick="setL('order','rand')">Aralash 🔀</button></div>
  </div>`;
  if (!L.list.length){ $app.innerHTML = head + `<div class="card empty">Bu filtr boʻyicha savol yoʻq.</div>`; return; }
  if (L.view==='list') return rLearnList(head);
  const d = L.list[L.idx], n = L.list.length;
  const st = ST.known[d.id] ? '<span class="badge b-k">✓ Bildim</span>' : (ST.again[d.id] ? '<span class="badge b-a">↻ Takrorlash</span>' : '');
  const lv = d.l==='o' ? '<span class="badge b-o">◐ oʻrta ishonch</span>' : (d.l==='p' ? '<span class="badge b-p">○ variantga qarab</span>' : '');
  const showAns = L.reveal || L.shown;
  let ansHtml;
  if (!showAns) ansHtml = `<button class="hidden-ans" onclick="L.shown=true;rLearn()">👆 Javobni koʻrish (boʻsh joy tugmasi)</button>`;
  else if (d.o) ansHtml = `<div class="optlist">${d.o.map((t,i)=>`<div class="opt static ${t===d.a?'ok':'dim'}"><span class="L">${'ABCD'[i]}</span><span>${esc(t)}</span></div>`).join('')}</div>${d.i?`<div class="izoh">💡 ${esc(d.i)}</div>`:''}`;
  else ansHtml = `<div class="ans"><div class="lbl">✔ Toʻgʻri javob</div><div class="t">${esc(d.a)}</div></div>${d.i?`<div class="izoh">💡 ${esc(d.i)}</div>`:''}`;
  $app.innerHTML = head + `
  <div class="card">
    <div class="qnum"><span><b>${L.idx+1}</b> / ${n}</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><span class="badge b-cat">${CATNAME[d.c]}</span>${lv}${st}</span></div>
    <div class="bar pri" style="margin:0 0 10px"><i style="width:${((L.idx+1)/n*100).toFixed(2)}%"></i></div>
    <div class="qtext">${esc(d.q)}</div>
    ${ansHtml}
  </div>
  <div class="kbd">⌨️ ← → oldingi/keyingi · Probel: javobni koʻrish · 1: Takrorlash · 2: Bildim</div>`;
  $dock.innerHTML = `<div class="dock"><div class="in">
    <button class="btn sq" onclick="lMove(-1)" ${L.idx===0?'disabled':''}>◀</button>
    <button class="btn bad" onclick="lMark('again')">↻ Takrorlash</button>
    <button class="btn ok" onclick="lMark('known')">✓ Bildim</button>
    <button class="btn sq" onclick="lMove(1)" ${L.idx>=n-1?'disabled':''}>▶</button>
  </div></div>`;
}
function lMove(s){ const n=L.list.length; L.idx=Math.max(0,Math.min(n-1,L.idx+s)); L.shown=false; learnSavePrefs(); rLearn(); }
function lMark(t){
  const d=L.list[L.idx]; if(!d) return;
  if (t==='known'){ ST.known[d.id]=1; delete ST.again[d.id]; } else { ST.again[d.id]=1; delete ST.known[d.id]; }
  save();
  if (L.filter==='new' && t==='known' || L.filter==='again' && t==='known' || L.filter==='known' && t==='again'){ L.list.splice(L.idx,1); if(L.idx>=L.list.length) L.idx=Math.max(0,L.list.length-1); }
  else if (L.idx < L.list.length-1) L.idx++;
  L.shown=false; learnSavePrefs(); rLearn();
}
function rLearnList(head){
  const per=30, pages=Math.ceil(L.list.length/per); if (L.page>=pages) L.page=0;
  const part=L.list.slice(L.page*per, L.page*per+per);
  const pager = `<div class="pager"><button class="btn sq" ${L.page===0?'disabled':''} onclick="L.page--;rLearn();scrollTo(0,0)">◀</button><span class="small muted">${L.page+1} / ${pages} sahifa</span><button class="btn sq" ${L.page>=pages-1?'disabled':''} onclick="L.page++;rLearn();scrollTo(0,0)">▶</button></div>`;
  $app.innerHTML = head + `<div class="card list">${part.map((d,i)=>`<div class="li"><div class="q">${L.page*per+i+1}. ${esc(d.q)}</div><div class="a">✔ ${esc(d.a)}${d.l==='p'?' <span class="badge b-p">○</span>':(d.l==='o'?' <span class="badge b-o">◐</span>':'')}</div>${d.i?`<div class="z">${esc(d.i)}</div>`:''}</div>`).join('')}</div>` + pager;
}

/* ---------- TEST: rejim tanlash ---------- */
let Q = null, timerId = null;
function rTest(){
  const wrongN = Object.keys(ST.wrong).length;
  const cc = k => testable.filter(d=>d.c===k).length;
  $app.innerHTML = `
  <div class="top"><button class="back" onclick="go('home')">←</button><h1>📝 Test topshirish</h1></div>
  <button class="mode main" onclick="startExam()"><div class="ic">🎓</div><div><h3>Imtihon (haqiqiy test kabi)</h3><p>40 savol: har bir blokdan 10 tadan · 60 daqiqa · oʻtish 56% · natija oxirida</p></div></button>
  <button class="mode" onclick="startPractice('mix',20)"><div class="ic">⚡</div><div><h3>Tezkor mashq — 20 savol</h3><p>Barcha boʻlimlardan aralash · javob darhol tekshiriladi</p></div></button>
  <button class="mode" onclick="startPractice('mix',50)"><div class="ic">🏃</div><div><h3>Katta mashq — 50 savol</h3><p>Barcha boʻlimlardan aralash · darhol tekshirish</p></div></button>
  <button class="mode" onclick="startWrong()" ${wrongN?'':'disabled style="opacity:.55"'}><div class="ic">🎯</div><div><h3>Xatolarim ustida ishlash</h3><p>${wrongN?wrongN+' ta savol · toʻgʻri topganingiz roʻyxatdan chiqadi':'Hozircha xato yoʻq'}</p></div></button>
  <div class="sec-t">Boʻlim boʻyicha mashq (20 savol)</div>
  <div class="grid2">
    ${EXAM_BLOCKS.map(b=>`<button class="mode" style="margin:0" onclick="startPractice('${b.k}',20)"><div class="ic">${CATS.find(c=>c.k===b.k).ic}</div><div><h3>${b.n}</h3><p>${b.from.reduce((s,k)=>s+cc(k),0)} ta savol bazada</p></div></button>`).join('')}
  </div>
  <p class="small muted" style="margin-top:16px">Har safar savollar ham, variantlar tartibi ham tasodifiy tanlanadi. Rasmiy bazadagi savollar variantlarsiz eʼlon qilingani uchun notoʻgʻri variantlar boshqa savollarning javoblaridan olinadi. Haqiqiy testda variantlar boshqacha boʻlishi mumkin, shuning uchun toʻgʻri javobning mazmunini yodlang.</p>`;
}
function poolFor(k){ const b = EXAM_BLOCKS.find(x=>x.k===k); const from = b? b.from : [k]; return testable.filter(d=>from.includes(d.c)); }
function mkQ(items){ return items.map(d=>({d, opts:makeOptions(d), ans:null})); }
function startExam(){
  const items = []; EXAM_BLOCKS.forEach(b=> items.push(...pick(poolFor(b.k),10).map(d=>Object.assign({},d,{blk:b.k}))));
  Q = {mode:'exam', list:mkQ(items), i:0, start:Date.now(), limit:60*60*1000, done:false};
  go('quiz');
}
function startPractice(k, n){
  let items;
  if (k==='mix'){ const per=Math.ceil(n/4); items=[]; EXAM_BLOCKS.forEach(b=>items.push(...pick(poolFor(b.k),per).map(d=>Object.assign({},d,{blk:b.k})))); items = shuffle(items).slice(0,n); }
  else items = pick(poolFor(k), n).map(d=>Object.assign({},d,{blk:k}));
  Q = {mode:'practice', title: k==='mix'?'Aralash mashq':CATNAME[k], list:mkQ(items), i:0, start:Date.now(), done:false};
  go('quiz');
}
function startWrong(){
  const ids = Object.keys(ST.wrong).map(Number);
  const items = shuffle(DATA.filter(d=>ids.includes(d.id))).slice(0,40).map(d=>Object.assign({},d,{blk:EXAM_BLOCKS.find(b=>b.from.includes(d.c))?.k||d.c}));
  Q = {mode:'wrong', title:'Xatolarim', list:mkQ(items), i:0, start:Date.now(), done:false};
  go('quiz');
}

/* ---------- TEST: savol ekrani ---------- */
function fmt(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function rQuiz(){
  if (!Q){ go('test'); return; }
  const n = Q.list.length, it = Q.list[Q.i], exam = Q.mode==='exam';
  const answered = Q.list.filter(x=>x.ans!==null).length;
  let timer = '';
  if (exam){ const left = Q.limit-(Date.now()-Q.start); timer = `<span class="timer ${left<5*60000?'low':''}" id="tm">⏱ ${fmt(left)}</span>`;
    if (!timerId) timerId = setInterval(()=>{ const l=Q.limit-(Date.now()-Q.start); const el=document.getElementById('tm'); if(el){ el.textContent='⏱ '+fmt(l); el.classList.toggle('low', l<5*60000);} if(l<=0){ clearInterval(timerId); timerId=null; finish(); } },1000); }
  const showFb = !exam && it.ans!==null;
  const optsHtml = it.opts.map((o,k)=>{
    let cls='';
    if (exam){ if (it.ans===k) cls='sel'; }
    else if (it.ans!==null){ if (o.ok) cls='ok'; else if (it.ans===k) cls='bad'; else cls='dim'; }
    return `<button class="opt ${cls}" ${(!exam && it.ans!==null)?'disabled':''} onclick="answer(${k})"><span class="L">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`;
  }).join('');
  let fb = '';
  if (showFb){ const ok = it.opts[it.ans].ok; fb = `<div class="feedback ${ok?'ok':'bad'}"><b>${ok?'✓ Toʻgʻri!':'✗ Notoʻgʻri.'}</b> ${ok?'':'Toʻgʻri javob: <b>'+esc(it.d.a)+'</b>'}${it.d.i?`<div style="margin-top:6px">💡 ${esc(it.d.i)}</div>`:''}</div>`; }
  const grid = exam ? `<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">Savollar xaritasi (${answered}/${n} javob berildi)</summary><div class="navgrid">${Q.list.map((x,k)=>`<button class="nv ${x.ans!==null?'a':''} ${k===Q.i?'cur':''}" onclick="Q.i=${k};rQuiz()">${k+1}</button>`).join('')}</div></details>` : '';
  $app.innerHTML = `
  <div class="tbar"><button class="back" onclick="quitQuiz()">✕</button><div style="flex:1"><div class="small muted">${exam?'Imtihon':esc(Q.title)} · ${CATNAME[it.d.c]}</div><b>${Q.i+1} / ${n}</b></div>${timer}</div>
  <div class="bar pri" style="margin:0 0 14px"><i style="width:${((exam?answered:Q.i+ (it.ans!==null?1:0))/n*100).toFixed(1)}%"></i></div>
  <div class="card">
    <div class="qtext" style="margin-top:0">${esc(it.d.q)}</div>
    <div class="optlist">${optsHtml}</div>
    ${fb}
    ${grid}
  </div>
  <div class="kbd">⌨️ 1–4 yoki A–D: variant tanlash · Enter: keyingi</div>`;
  const last = Q.i>=n-1;
  if (exam) $dock.innerHTML = `<div class="dock"><div class="in"><button class="btn sq" onclick="qMove(-1)" ${Q.i===0?'disabled':''}>◀</button><button class="btn" onclick="askFinish()">Yakunlash</button><button class="btn pri" onclick="${last?'askFinish()':'qMove(1)'}">${last?'Natija':'Keyingi ▶'}</button></div></div>`;
  else $dock.innerHTML = `<div class="dock"><div class="in"><button class="btn" onclick="askFinish()">Yakunlash</button><button class="btn pri" ${it.ans===null?'disabled':''} onclick="${last?'finish()':'qMove(1)'}">${last?'Natijani koʻrish':'Keyingi ▶'}</button></div></div>`;
}
function answer(k){
  const it = Q.list[Q.i];
  if (Q.mode==='exam'){ it.ans=k; rQuiz(); setTimeout(()=>{ if(Q && Q.mode==='exam' && Q.i<Q.list.length-1 && VIEW==='quiz'){ Q.i++; rQuiz(); } }, 260); return; }
  if (it.ans!==null) return;
  it.ans = k; const ok = it.opts[k].ok;
  if (ok){ if (Q.mode==='wrong') delete ST.wrong[it.d.id]; }
  else ST.wrong[it.d.id] = (ST.wrong[it.d.id]||0)+1;
  save(); rQuiz();
}
function qMove(s){ Q.i = Math.max(0, Math.min(Q.list.length-1, Q.i+s)); rQuiz(); window.scrollTo(0,0); }
function askFinish(){
  const left = Q.list.filter(x=>x.ans===null).length;
  modal('Testni yakunlaysizmi?', left? `Hali <b>${left}</b> ta savolga javob berilmagan. Javobsiz savollar xato hisoblanadi.` : 'Barcha savollarga javob berildi.', 'Yakunlash', finish, 'Davom etish');
}
function quitQuiz(){ modal('Testdan chiqasizmi?', 'Bu urinish natijasi saqlanmaydi.', 'Chiqish', ()=>{ clearInterval(timerId); timerId=null; Q=null; go('test'); }, 'Davom etish'); }
function finish(){
  clearInterval(timerId); timerId=null;
  Q.done = true; Q.end = Date.now();
  if (Q.mode==='exam'){
    Q.list.forEach(x=>{ const ok = x.ans!==null && x.opts[x.ans].ok; if(!ok) ST.wrong[x.d.id]=(ST.wrong[x.d.id]||0)+1; });
    const c = Q.list.filter(x=>x.ans!==null && x.opts[x.ans].ok).length;
    ST.hist.push({p:Math.round(c/Q.list.length*100), d:Date.now()}); if (ST.hist.length>50) ST.hist.shift();
    save();
  }
  go('result');
}

/* ---------- NATIJA ---------- */
function rResult(){
  if (!Q){ go('test'); return; }
  const n=Q.list.length, c=Q.list.filter(x=>x.ans!==null && x.opts[x.ans].ok).length, p=Math.round(c/n*100);
  const pass = p>=56, exam = Q.mode==='exam';
  const blocks = EXAM_BLOCKS.map(b=>{ const xs=Q.list.filter(x=>x.d.blk===b.k); return {n:b.n, t:xs.length, c:xs.filter(x=>x.ans!==null && x.opts[x.ans].ok).length}; }).filter(b=>b.t);
  const wrongs = Q.list.filter(x=>!(x.ans!==null && x.opts[x.ans].ok));
  $app.innerHTML = `
  <div class="top"><button class="back" onclick="go('test')">←</button><h1>Natija</h1></div>
  <div class="card result">
    <div class="ring" style="background:conic-gradient(${pass?'var(--ok)':'var(--bad)'} ${p*3.6}deg, var(--line) 0)"><div style="width:122px;height:122px;border-radius:50%;background:#fff;display:grid;place-items:center" class="${pass?'pass':'fail'}">${p}%</div></div>
    <h2 class="${pass?'pass':'fail'}" style="margin:0">${pass?'🎉 Oʻtdingiz!':'Oʻtmadingiz'}</h2>
    <p class="muted" style="margin:6px 0 0">${c} / ${n} toʻgʻri · ${fmt(Q.end-Q.start)} vaqt · oʻtish chegarasi 56% (${Math.ceil(n*0.56)} ta)</p>
    <table class="bk"><tr><th>Boʻlim</th><th>Natija</th></tr>${blocks.map(b=>`<tr><td>${b.n}</td><td><b>${b.c}</b> / ${b.t}</td></tr>`).join('')}</table>
  </div>
  <div class="grid2" style="margin-top:14px">
    <button class="btn pri" onclick="${exam?'startExam()':`startPractice('mix',${n})`}">↻ Yana ${exam?'imtihon':'mashq'}</button>
    <button class="btn" onclick="go('test')">Rejimlar</button>
  </div>
  ${wrongs.length?`<div class="sec-t">Xatolar tahlili (${wrongs.length})</div><div class="rev">${wrongs.map((x,k)=>`<div class="item"><div style="font-weight:650">${k+1}. ${esc(x.d.q)}</div>${x.ans!==null?`<div class="y">✗ Siz: ${esc(x.opts[x.ans].t)}</div>`:'<div class="y">✗ Javob berilmagan</div>'}<div class="c">✔ ${esc(x.d.a)}</div>${x.d.i?`<div class="small muted" style="margin-top:4px">💡 ${esc(x.d.i)}</div>`:''}</div>`).join('')}</div>`:'<div class="card empty" style="margin-top:14px">Hammasi toʻgʻri! 👏</div>'}`;
}

/* ---------- klaviatura ---------- */
document.addEventListener('keydown', e=>{
  if ($modal.innerHTML) { if (e.key==='Escape') closeModal(); return; }
  if (e.target.tagName==='INPUT') return;
  if (VIEW==='learn' && L.view==='card'){
    if (e.key==='ArrowRight') lMove(1); else if (e.key==='ArrowLeft') lMove(-1);
    else if (e.key===' '){ e.preventDefault(); L.shown=true; rLearn(); }
    else if (e.key==='1') lMark('again'); else if (e.key==='2') lMark('known');
  } else if (VIEW==='quiz' && Q){
    const m = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
    if (m!==undefined && Q.list[Q.i].opts[m]) answer(m);
    else if (e.key==='Enter'){ const it=Q.list[Q.i]; if (Q.mode==='exam' || it.ans!==null){ if (Q.i<Q.list.length-1) qMove(1); else (Q.mode==='exam'?askFinish():finish()); } }
    else if (e.key==='ArrowRight' && Q.mode==='exam') qMove(1); else if (e.key==='ArrowLeft' && Q.mode==='exam') qMove(-1);
  }
});
let h0 = location.hash.slice(1);
if (h0.startsWith('s=')) {
  try { const n = applySyncCode('#'+h0); setTimeout(()=>toast(`✓ Boshqa qurilmadagi natijalar qoʻshildi (+${n} ta yodlangan)`), 300); } catch(e){ setTimeout(()=>toast('✗ Sinxronlash havolasi notoʻgʻri'), 300); }
  try { history.replaceState(null, '', location.pathname + location.search); } catch(e){ location.hash=''; }
  h0 = '';
}
VIEW = (h0==='learn'||h0==='test') ? h0 : 'home';
render();
</script>
</body>
</html>
