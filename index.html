<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davlat xizmati testi — Yodlash va Test</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#14213d; --muted:#5b6478; --line:#e3e7ef;
  --pri:#1f4fd1; --pri-2:#e8eefc; --ok:#16a34a; --ok-2:#e7f7ec; --bad:#dc2626; --bad-2:#fdecec;
  --warn:#d97706; --warn-2:#fff4e0; --shadow:0 6px 24px rgba(20,33,61,.08); --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{font-size:20px;margin:0;flex:1;line-height:1.25}
.back{width:42px;height:42px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.hero{background:linear-gradient(135deg,#1f4fd1,#3b2fc9);color:#fff;border-radius:20px;padding:22px;margin-bottom:16px}
.hero h1{margin:0 0 4px;font-size:22px}
.hero p{margin:0;opacity:.9;font-size:14.5px}
.hero .cd{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.16);padding:8px 12px;border-radius:12px;font-weight:600;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.big{display:block;text-align:left;width:100%;padding:22px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;transition:.15s}
.big:hover{border-color:var(--pri)}
.big .ic{font-size:34px}
.big h2{margin:6px 0 4px;font-size:21px}
.big p{margin:0;color:var(--muted);font-size:14.5px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.bar.pri>i{background:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.sec-t{font-size:15px;font-weight:700;margin:22px 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.chip small{opacity:.7;font-weight:500;margin-left:4px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
@media(max-width:620px){.tools{grid-template-columns:1fr}}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none}
.search:focus{border-color:var(--pri)}
.qnum{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.b-cat{background:var(--pri-2);color:var(--pri)}
.b-o{background:var(--warn-2);color:var(--warn)}
.b-p{background:var(--bad-2);color:var(--bad)}
.b-k{background:var(--ok-2);color:var(--ok)}
.b-a{background:var(--bad-2);color:var(--bad)}
.qtext{font-size:18.5px;font-weight:650;line-height:1.45;margin:6px 0 14px}
@media(max-width:620px){.qtext{font-size:17px}}
.ans{background:var(--ok-2);border-left:4px solid var(--ok);border-radius:12px;padding:14px 14px}
.ans .lbl{font-size:12.5px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.05em}
.ans .t{font-size:17.5px;font-weight:700;margin-top:2px}
.izoh{margin-top:10px;font-size:14px;color:var(--muted)}
.hidden-ans{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted);font-weight:600;width:100%}
.optlist{display:grid;gap:8px;margin-top:4px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-size:15.5px;line-height:1.4;transition:.12s}
.opt:hover:not([disabled]){border-color:#b8c6f2}
.opt .L{flex:0 0 28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--pri);background:var(--pri-2)} .opt.sel .L{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-2)} .opt.ok .L{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-2)} .opt.bad .L{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt.static{cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(244,246,251,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.dock .in{max-width:860px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;padding:14px 10px;border-radius:14px;font-weight:700;font-size:15.5px;background:var(--card);box-shadow:var(--shadow);text-align:center}
.btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad-2)}
.btn.sq{flex:0 0 54px}
.btn[disabled]{opacity:.45}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);border:2px solid transparent;margin-bottom:12px}
.mode:hover{border-color:var(--pri)}
.mode .ic{flex:0 0 52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--pri-2)}
.mode h3{margin:0;font-size:17px}
.mode p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.mode.main{border-color:var(--pri)}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.timer{font-weight:800;font-variant-numeric:tabular-nums;background:var(--card);padding:8px 12px;border-radius:12px;box-shadow:var(--shadow)}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
@media(max-width:520px){.navgrid{grid-template-columns:repeat(8,1fr)}}
.nv{aspect-ratio:1;border-radius:9px;background:var(--line);font-size:13px;font-weight:700;display:grid;place-items:center}
.nv.a{background:var(--pri);color:#fff} .nv.cur{outline:3px solid #f59e0b}
.nv.ok{background:var(--ok);color:#fff} .nv.bad{background:var(--bad);color:#fff}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--ok-2);color:#14532d} .feedback.bad{background:var(--bad-2);color:#7f1d1d}
.result{text-align:center;padding:26px 18px}
.ring{width:150px;height:150px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:34px;font-weight:800}
.pass{color:var(--ok)} .fail{color:var(--bad)}
table.bk{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
table.bk td,table.bk th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
table.bk td:last-child,table.bk th:last-child{text-align:right}
.rev{margin-top:12px}
.rev .item{padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
.rev .y{color:var(--bad);font-size:14.5px;margin-top:6px} .rev .c{color:var(--ok);font-size:14.5px;font-weight:700;margin-top:2px}
.list .li{padding:14px 2px;border-bottom:1px solid var(--line)}
.list .li .q{font-weight:650}
.list .li .a{color:#166534;font-weight:700;margin-top:4px}
.list .li .z{font-size:13px;color:var(--muted);margin-top:2px}
.pager{display:flex;gap:8px;justify-content:center;align-items:center;margin:16px 0}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:20px;z-index:20}
.modal .box{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%}
.modal h3{margin:0 0 6px}
.modal .row{display:flex;gap:8px;margin-top:16px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist span{font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
@media(max-width:620px){.kbd{display:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
</style>
</head>

<script>
const DATA = [{"c":"qonun","s":"r","q":"Xalq deputatlari Kengashining vakolatlari muddati necha yil?","a":"5 yil","i":"Konstitutsiya: xalq deputatlari Kengashlari vakolat muddati 5 yil","l":"y","id":0,"t":1},{"c":"qonun","s":"r","q":"Oliy Majlis Qonunchilik palatasi deputatini daxlsizlik huquqidan mahrum etish to’g’risidagi taqdimnomani qaysi sub’ekt tomonidan bildirilishi mumkin?","a":"Oʻzbekiston Respublikasi Bosh prokurori","i":"Konstitutsiya: deputat daxlsizligi Bosh prokuror taqdimnomasiga koʻra palata roziligi bilan olinadi","l":"y","id":1,"t":1},{"c":"qonun","s":"r","q":"Agar qonunchilikda boshqacha qoida nazarda tutilmagan boʻlsa, ma’muriy organ mumkin qadar qisqa muddatlarda, ammo ariza ma’muriy organda roʻyxatga olingan kundan e’tiboran, ma’muriy hujjat ma’muriy organ tashabbusi bilan qabul qilinadigan taqdirda esa, adresat ma’muriy ish yuritish boshlanganligi toʻgʻrisida tegishli tarzda xabardor qilingan kundan e’tiboran qancha muddatdan kechiktirmay ma’muriy ishni koʻrib chiqadi va ma’muriy hujjatni qabul qiladi.","a":"30 ish kunidan kechiktirmay (eski tahrirda – bir oy)","i":"Maʼmuriy tartib-taomillar toʻgʻrisidagi qonun 36-modda (OʻRQ-683 tahriri)","l":"o","id":2,"t":1},{"c":"qonun","s":"r","q":"Ta’lim muassasalarida korrupsiyaga qarshi kurashish sohasida huquqiy ta’lim va tarbiyaga doir chora-tadbirlarni amalga oshirishda ishtirok etish qaysi subyektning vakolatlari doirasida?","a":"Fuqarolarning oʻzini oʻzi boshqarish organlari, NNTlar va boshqa fuqarolik jamiyati institutlari (taʼlim organlari bilan birga)","i":"Korrupsiyaga qarshi kurashish toʻgʻrisidagi qonun (OʻRQ-419); variantlarsiz aniqlash qiyin","l":"p","id":3,"t":0},{"c":"qonun","s":"r","q":"Davlat fuqarolik xizmatchisi tomonidan xizmat safarlari, xalqaro va boshqa rasmiy tadbirlar munosabati bilan olinishi mumkin boʻlgan sovgʻa qiymati, shuningdek uni tasarruf etish tartibi qaysi tashkilot tomonidan belgilanadi?","a":"Oʻzbekiston Respublikasi Vazirlar Mahkamasi","i":"DFX qonuni (sovgʻalar moddasi) – qiymat va tasarruf tartibi VM tomonidan belgilanadi","l":"o","id":4,"t":1},{"c":"qonun","s":"r","q":"Davlat siyosiy rеjim shakliga koʻra qanday guruhlarga boʻlinadi?","a":"Demokratik va nodemokratik (avtoritar, totalitar) rejimlar","i":"Davlat va huquq nazariyasi","l":"y","id":5,"t":1},{"c":"qonun","s":"r","q":"Davlat fuqarolik xizmatchisiga davomiyligi qancha kundan kam boʻlmagan yillik asosiy ta’til beriladi?","a":"27 kundan kam boʻlmagan","i":"DFX qonuni: yillik asosiy taʼtil kamida 27 kun","l":"y","id":6,"t":1},{"c":"qonun","s":"r","q":"Tegishli soha ichidagi tarmoq faoliyatini muvofiqlashtiruvchi va tartibga soluvchi hamda tizimdagi rahbariy faoliyatni kollegial asosda tashkil etadigan, shuningdek, vazirlikning tashkiliy boʻysunuvida faoliyat yuritadigan respublika ijro etuvchi hokimiyat organi hisoblanadigan javobni aniqlang.","a":"Qoʻmita (vazirlik tarkibidagi qoʻmita)","i":"Ijro etuvchi hokimiyat organlari toʻgʻrisidagi qonun: qoʻmita – kollegial, vazirlikka boʻysunadi","l":"o","id":7,"t":1},{"c":"qonun","s":"r","q":"Davlat fuqarolik xizmatchilarining odob-axloq qoidalariga rioya etilishi ustidan nazorat kim tomonidan amalga oshiriladi?","a":"Davlat organlarining kadrlar boʻlinmalari, Odob-axloq komissiyalari va maxsus vakolatli davlat organi","i":"VMQ-595 (14.10.2022) Namunaviy qoidalar 26-band","l":"y","id":8,"t":1},{"c":"qonun","s":"r","q":"Intizomiy jazo chorasi darhol, biroq intizomiy qilmish aniqlangan kundan e’tiboran qancha muddatdan kechiktirmay qoʻllaniladi?","a":"Bir oydan kechiktirmay","i":"DFX qonuni 48-modda; Mehnat kodeksi ham shunday","l":"o","id":9,"t":1},{"c":"qonun","s":"r","q":"Shaxs sudning qarorisiz qancha muddatdan ortiq ushlab turilishi mumkin emas.","a":"48 soatdan ortiq","i":"Konstitutsiya: shaxs sud qarorisiz 48 soatdan ortiq ushlab turilishi mumkin emas","l":"y","id":10,"t":1},{"c":"qonun","s":"r","q":"Fuqarolarning Konstitutsiya va qonunlarda mustahkamlab qoʻyilgan huquq va erkinliklari daxlsizdir, ulardan mahrum etishg ini ma’lum qilamiz.”","a":"«doirasida».","i":"«vakolati doirasida» – rasmiy qolip.","l":"y","id":828,"t":1},{"c":"til","s":"r","q":"Berilgan gap rasmiy uslub talabiga koʻra toʻgʻri yakunlangan javobni belgilang. “Mazkur kamchilikka yoʻl qoʻygan xodimlarga nisbatan ...”","a":"«…intizomiy jazo chorasi qoʻllanilsin.»","i":"Buyruq -ilsin bilan yakunlanadi.","l":"o","id":829,"t":1},{"c":"til","s":"r","q":"Qaysi gapda faqat bir oʻrinda vergul tushirilgan?","a":"Qoida: undalma, kirish soʻz, uyushiq boʻlak, ajratilgan boʻlak, qoʻshma gap qismlari orasidagi vergullarni sanab, bitta tushgan gapni tanlang.","i":"Variantlarsiz.","l":"p","id":830,"t":0},{"c":"til","s":"r","q":"Qaysi javobdagi juft soʻzning ikkala qismi oʻzaro ma’nodosh (sinonim) boʻla olmaydi?","a":"Qoida: qismlari zid (oq-qora, kecha-kunduz) yoki turdosh (ota-ona, choy-non) boʻlgan juftni tanlang, sinonim emas.","i":"Variantlarsiz.","l":"p","id":831,"t":0},{"c":"til","s":"r","q":"“Avgʻonistondagi qarama- qarshilik¬ning dunyo miqiyosida kelib chiqishi mumkin boʻlgan havfli oqibatlarining oldini olish haqida jiddiy oʻylash lozim”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"2 oʻrinda: miqiyosida→miqyosida, havfli→xavfli.","i":"«qarama- qarshilik»dagi boʻsh joy texnik xato.","l":"o","id":832,"t":1},{"c":"til","s":"r","q":"Qaysi uslubda “qaror qilindi”, “inobatga olinsin”, “ijro uchun qabul qilinsin” kabi qoliplashgan soʻz va soʻz birikmalari keng qoʻllanadi?","a":"Rasmiy uslub.","i":"Qoliplashgan rasmiy birikmalar.","l":"y","id":833,"t":1},{"c":"til","s":"r","q":"“Bu yangilikning avzalligini tushinsa ham unga toʻgʻonoq boʻlayotganlar borligi achinarlidir”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"3 oʻrinda: avzalligini→afzalligini, tushinsa→tushunsa, toʻgʻonoq→toʻgʻanoq.","i":"«achinarlidir» toʻgʻri.","l":"y","id":834,"t":1},{"c":"til","s":"r","q":"“Litsenziya –muayan faoliyatni amalga oshirish uchun davlat organlari tomonidan beriladigan ruxsat”. Ushbu gapda necha oʻrinda imloviy xatolik uchraydi?","a":"1 oʻrinda: muayan→muayyan.","i":"Tire oldidagi boʻsh joy imlo emas.","l":"y","id":835,"t":1},{"c":"til","s":"r","q":"Rasmiy uslubda yozilgan qaysi parchada qoʻshimcha qoʻllash bilan bogʻliq xatolik mavjud?","a":"Qoida: kelishik (-ni/-ning, -ga/-da), egalik yoki ortiqcha -lar notoʻgʻri qoʻllangan parchani tanlang.","i":"Variantlarsiz.","l":"p","id":836,"t":0},{"c":"til","s":"r","q":"“Скоросшиватель” soʻzining oʻzbek tilidagi tarjimasi berilgan javobni aniqlang.","a":"Tezikkich (tez tikkich) – hujjat jildi.","i":"Скоросшиватель tarjimasi.","l":"o","id":837,"t":1},{"c":"til","s":"r","q":"“qolmoq” soʻzi qaysi javobda joyini tark etmaslik ma’nosida qoʻllangan?","a":"Qoida: «U uyda qoldi» (ketmadi) tipidagi gapni tanlang.","i":"qolmoq = joyini tark etmaslik.","l":"p","id":838,"t":0},{"c":"til","s":"r","q":"Qaysi javobda har ikkala soʻzdagi nuqtalar oʻrnida “h” undoshi yoziladi?","a":"Qoida: h yoziladigan soʻzlar: hayot, shahar, haykal, gunoh, zehn, halol, harom, ahd, lavha, muhofaza, mahalla.","i":"Variantlarsiz.","l":"p","id":839,"t":0},{"c":"til","s":"r","q":"“Jazolanib, hushyor tortmoq” ma’nosini anglatuvchi iborani aniqlang.","a":"«Tavbasiga tayandi».","i":"Jazolanib, hushyor tortdi maʼnosi.","l":"o","id":840,"t":1},{"c":"til","s":"r","q":"“Прейскурант” soʻzining oʻzbek tilidagi tarjimasi berilgan javobni aniqlang.","a":"Narxnoma.","i":"Прейскурант tarjimasi.","l":"y","id":841,"t":1},{"c":"til","s":"r","q":"Tutuq belgisi tushirilganda yangi ma’noli soʻz hosil boʻladigan soʻzlarni belgilang.","a":"Qoida: sheʼr–sher, taʼna–tana, vaʼz–vaz, suʼrat–surat, maʼno–mano kabi juftlarni tanlang.","i":"Tutuq belgisi maʼno farqlaydi.","l":"p","id":842,"t":0},{"c":"til","s":"r","q":"“Maxsus boshqarish faoliyati”. Ushbu izoh berilgan soʻzlardan qaysi biriga mos?","a":"Menejment.","i":"Boshqaruv faoliyati.","l":"o","id":843,"t":1},{"c":"til","s":"r","q":"Koʻpchilikni kelgusida boʻladigan biror tadbir haqida xabardor qilish uchun qoʻllanadigan yozma axborot qanda y uslubga mos.","l":"y","id":852,"t":1},{"c":"til","s":"r","q":"“Xalq qabulxonalari, boshqa virtual qabulxonalarga elektron shakldagi arizalarni … mumkin.” \"","a":"«yuborish» (68-savol davomi).","i":"68-savol bilan bir butun.","l":"y","id":853,"t":1},{"c":"til","s":"r","q":"Imloviy jihatdan toʻgʻri yozilgan soʻzni belgilang.","a":"Qoida: lugʻatdagi shakl bilan solishtiring (h/x, qoʻsh undosh, tutuq belgisi, unli).","i":"Variantlarsiz.","l":"p","id":854,"t":0},{"c":"til","s":"r","q":"Rasmiy uslubda yozilgan qaysi parchada qoʻshimcha qoʻllash bilan bogʻliq xatolik mavjud emas?","a":"Qoida: kelishik, egalik, koʻplik qoʻshimchalari toʻgʻri, ortiqcha -lar yoʻq parchani tanlang.","i":"Variantlarsiz.","l":"p","id":855,"t":0},{"c":"til","s":"r","q":"Internetga oid termin hisoblangan “xeshteg” soʻzining izohi toʻgʻri berilgan javobni aniqlang.","a":"Xeshteg – # bilan boshlanadigan, postlarni mavzu boʻyicha guruhlash va izlash uchun kalit soʻz.","i":"Internet termini.","l":"y","id":856,"t":1},{"c":"til","s":"r","q":"Buyruq matnida qoʻllanadigan qoliplashgan birliklar berilgan javobni belgilang.","a":"«Buyuraman», «tayinlansin», «ijro uchun qabul qilinsin», «nazorat … zimmasiga yuklansin».","i":"Buyruq qoliplari.","l":"o","id":857,"t":1},{"c":"til","s":"r","q":"sohibqiron amir temur oʻzi qurdirgan oqsaroy peshtoqiga: “qudratimizga shak-shubhangiz boʻlsa, biz qurdirgan binolarga boqing”, – deb yozdirgan edi. Ushbu gapda necha oʻrinda bosh harflar imlosi bilan bogʻliq xatolik uchraydi?","a":"5 oʻrinda: Sohibqiron, Amir, Temur, Oqsaroy, Qudratimizga.","i":"Gap boshi, atoqli ot, koʻchirma gap boshi.","l":"o","id":858,"t":1},{"c":"til","s":"r","q":"Qaysi gapda ikki oʻrinda vergul qoʻyilishi lozim?","a":"Qoida: undalma, kirish soʻz, uyushiq boʻlak, ajratilgan boʻlak, qoʻshma gap qismlarini sanab, ikki vergul kerak gapni tanlang.","i":"Variantlarsiz.","l":"p","id":859,"t":0},{"c":"til","s":"r","q":"“Опекун” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Vasiy.","i":"Опекун tarjimasi.","l":"y","id":860,"t":1},{"c":"til","s":"r","q":"Qaysi javobda soʻz qoʻllash bilan xatolik mavjud?","a":"Qoida: maʼnosiga mos kelmagan, pleonazmli yoki uslubga mos boʻlmagan soʻz qoʻllangan javobni tanlang.","i":"Variantlarsiz.","l":"p","id":861,"t":0},{"c":"til","s":"r","q":"Ommaviy axborot vositalari (gazeta-jurnal, radio, tele­videniye)da, faol qoʻllana­digan nutq uslubi qanday ataladi?","a":"Publitsistik uslub.","i":"OAV uslubi.","l":"y","id":862,"t":1},{"c":"til","s":"r","q":"\"цивилизация\" soʻzi lotin alifbosidagi imlo qoidalariga koʻra toʻgʻri yozilgan javobni belgilang.","a":"sivilizatsiya","i":"ц soʻz boshida s, unlidan keyin ts.","l":"y","id":863,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi birlik imloviy jihatdan toʻgʻri yozilgan?","a":"Qoida: imlo lugʻati boʻyicha tekshiring (qoʻshib/ajratib yozish, h/x, tutuq belgisi, ц→s/ts).","i":"Variantlarsiz.","l":"p","id":864,"t":0},{"c":"til","s":"r","q":"Quyidagi gapda ajratib koʻrsatilgan soʻzlarning imlosi toʻgʻri koʻrsatilgan javobni belgilang. “Shifokorlarning aytishicha, ochkoʻzlik turli kasalliklarga, osh//qozon tizimining buzilishiga, yuzga husn//buzarlar toshishiga olib//keladi”","a":"oshqozon, husnbuzar, olib keladi.","i":"Qoʻshma ot qoʻshib, koʻmakchi fe'l ajratib.","l":"y","id":865,"t":1},{"c":"til","s":"r","q":"Qaysi gapda tinish belgisini qoʻllash bilan bogʻliq xatolik mavjud emas?","a":"Qoida: vergul, tire, ikki nuqta, qoʻshtirnoq oʻrinli qoʻyilgan gapni tanlang.","i":"Variantlarsiz.","l":"p","id":866,"t":0},{"c":"til","s":"r","q":"Qaysi hujjatda xodim (ishchi) aniq bir ishni bajarishni zimmasiga olishi, muassasa esa ish haqini toʻlash va shu ishni bajarish uchun sharoit yaratib berish majburiyatlari aks ettiriladi?","a":"Mehnat shartnomasi (kontrakt).","i":"Ikki tomon majburiyatlari.","l":"y","id":867,"t":1},{"c":"til","s":"r","q":"Birinchi shaxs nomidan yoziladigan hujjatni belgilang.","a":"Ariza.","i":"Birinchi shaxs nomidan (soʻrayman).","l":"o","id":868,"t":1},{"c":"til","s":"r","q":"“Toshni kesa olmas pichoqning(1) dami, Pok tanga oʻtmaydi saraton (2) dami, Ilm va hunarga bagʻishla oʻzni, Gʻanimat yoshlikning har oʻtgan (3) dami”. Ushbu parchada (1) raqami bilan berilgan soʻzning ma’nodoshini toping.","a":"Tigʻ (oʻtkirlik).","i":"(1) dam = pichoq tigʻi.","l":"y","id":869,"t":1},{"c":"til","s":"r","q":"Qaysi javobda oʻzaro zid ma’noli (antonim) soʻzlar ishtirok etgan?","a":"Qoida: zid maʼnoli soʻz juftlari (yaxshi–yomon, oq–qora, issiq–sovuq, kecha–kunduz) bor javobni tanlang.","i":"Variantlarsiz.","l":"p","id":870,"t":0},{"c":"til","s":"r","q":"“Bayonot” soʻzi bilan ma’nodosh boʻla oladigan soʻzni aniqlang.","a":"Deklaratsiya (rasmiy bildiruv).","i":"«Bayonot» maʼnodoshi.","l":"o","id":871,"t":1},{"c":"til","s":"r","q":"“Опись” soʻzining oʻzbek tilidagi tarjimasini aniqlang.","a":"Roʻyxat (opis).","i":"Опись tarjimasi.","l":"y","id":872,"t":1},{"c":"til","s":"r","q":"Berilgan soʻzlardan qaysi biriga “ma’lum bir mavzu boʻyicha eng qiziqarli nashrlarni yetkazadigan qisqa maqola” izohi mos keladi?","a":"Dayjest.","i":"Izoh dayjestga mos.","l":"y","id":873,"t":1},{"c":"til","s":"r","q":"Tashkilot rahbari oʻz xodimini malaka oshirish maqsadida xorijga yuborish uchun qanday hujjat rasmiylashtiradi?","a":"Buyruq (xizmat safariga yuborish haqida).","i":"Rahbar qarori buyruq bilan.","l":"o","id":874,"t":1},{"c":"til","s":"r","q":"Chiziqcha notoʻgʻri qoʻllangan javobni belgilang.","a":"Qoida: chiziqcha juft/takroriy soʻzda, -u/-yu, -a/-ya, -ku, -da yuklamalarida; -oq/-yoq, -mi, -chi qoʻshib yoziladi.","i":"Variantlarsiz.","l":"p","id":875,"t":0},{"c":"til","s":"r","q":"“Oʻtmish …ayot lav…alaridan …otiramda qolganlarini qogʻozga tushirishga a…d qildim” Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “x” qoʻllanadi?","a":"1 ta (xotiramda).","i":"hayot, lavha, ahd – h bilan.","l":"y","id":876,"t":1},{"c":"til","s":"r","q":"Qaysi javobda tashkiliy hujjat nomi berilgan?","a":"Qoida: tashkiliy hujjatlar – nizom, ustav, yoʻriqnoma, shtat jadvali, ichki tartib qoidalari.","i":"Variantlarsiz.","l":"o","id":877,"t":0},{"c":"til","s":"r","q":"Quyida berilgan parcha qaysi hujjat matniga tegishli? “Sotuvchi fors-major holatlar natijasida yuzaga keldigan oqibatlar uchun javobgar boʻlmaydi”","a":"Shartnoma (oldi-sotdi shartnomasi).","i":"«Sotuvchi», «fors-major» – shartnoma bandi.","l":"y","id":878,"t":1},{"c":"til","s":"r","q":"“tortmoq” soʻzi qaysi javobda jalb etmoq ma’nosida qoʻllangan?","a":"Qoida: «Uni ishga tortdi» tipidagi gapni tanlang.","i":"tortmoq = jalb etmoq.","l":"p","id":879,"t":0},{"c":"til","s":"r","q":"Uning yuragini “ayriliq” dardi azoblar edi. Gapda ajratib koʻrsatilgan soʻz bilan ma’nodosh (sinonim) boʻla olmaydigan soʻzni belgilang.","a":"Qoida: «ayriliq» sinonimlari – judolik, hijron, firoq, ayrilish; ularga kirmaydiganini (mas., visol) tanlang.","i":"Variantlarsiz.","l":"p","id":880,"t":0},{"c":"til","s":"r","q":"Qaysi maqolda oʻzaro zid ma’noli soʻzlar ishtirok etmagan?","a":"Qoida: maqollarda zid juftlar (yaxshi–yomon, kecha–bugun, bor–yoʻq) yoʻq maqolni tanlang.","i":"Variantlarsiz.","l":"p","id":881,"t":0},{"c":"til","s":"r","q":"“Sha…arda A…mad al-Fargʻoniy nomidagi istiro…at bogʻi ochish, uning …aykalini oʻrnatish rejalashtirildi”. Ushbu gapda nechta soʻzda nuqtalar oʻrnida “h” undoshi qoʻllanadi?","a":"4 ta: shahar, Ahmad, istirohat, haykal.","i":"Hammasi h bilan.","l":"y","id":882,"t":1},{"c":"til","s":"r","q":"“Извещение” soʻzining oʻzbekcha muqobilini toping.","a":"Bildirishnoma.","i":"Извещение muqobili.","l":"y","id":883,"t":1},{"c":"til","s":"r","q":"Berilgan gap rasmiy uslub talablariga koʻra toʻgʻri yakunlangan javobni belgilang. “Meni Xalq ta’limi boshqarmasiga bosh mutaxassis lavozimiga ...”","a":"«…lavozimiga ishga qabul qilishingizni soʻrayman.»","i":"Ariza qolipi.","l":"y","id":884,"t":1},{"c":"til","s":"r","q":"Xodim kasaba uyushmasidan davolanish uchun yoʻllanma olish maqsadida kasalligini tasdiqlovchi qanday hujjat taqdim etadi?","a":"Maʼlumotnoma (tibbiy).","i":"Kasallikni tasdiqlovchi hujjat.","l":"y","id":885,"t":1},{"c":"til","s":"r","q":"Qaysi javobdagi juft soʻzning ikkala qismi oʻzaro ma’nodosh (sinonim) boʻla oladi?","a":"Qoida: ikkala qismi bir maʼnoli juftni tanlang (yor-doʻst, mehr-muhabbat, ota-bobo emas).","i":"Variantlarsiz.","l":"p","id":886,"t":0},{"c":"til","s":"r","q":"Quyida berilgan parcha qaysi hujjat matniga tegishli? “Oʻz hisobimdan 3 kunlik ta’til berishingizni soʻrayman”.","a":"Ariza.","i":"«…soʻrayman» – ariza qolipi.","l":"y","id":887,"t":1},{"c":"til","s":"r","q":"Qaysi javobda soʻz qoʻllash bilan bogʻliq uslubiy xatolik mavjud?","a":"Qoida: uslubga mos kelmagan, pleonazm yoki notoʻgʻri maʼnoda qoʻllangan soʻz bor javobni tanlang.","i":"Variantlarsiz.","l":"p","id":888,"t":0},{"c":"til","s":"r","q":"“quruq” soʻzi qaysi javobda suvi, nami yoʻq ma’nosida qoʻllangan?","a":"Qoida: «quruq yer», «quruq oʻtin» tipidagi gapni tanlang (nam yoʻq).","i":"quruq = suvi, nami yoʻq.","l":"p","id":889,"t":0},{"c":"til","s":"r","q":"\"Ushbu qoʻshma gap qismlari oʻrtasida qaysi tinish belgisi qoʻllanadi?","a":"Vergul: «Shuni alohida taʼkidlaymanki, hech bir fuqaro himoyasiz emas».","i":"-ki bilan ergashgan qoʻshma gap.","l":"y","id":890,"t":1},{"c":"til","s":"r","q":"Shuni alohida ta’kidlaymanki // hech bir fuqaro himoyasiz emas.\"","a":"Vergul (106-savol davomi).","i":"106-savol bilan bir butun.","l":"y","id":891,"t":1},{"c":"til","s":"r","q":"\"Ushbu parchada nechta imloviy xatolik uchraydi?","a":"Parcha 109-band: 0 ta xato; 113-band variantida 2 ta.","i":"Ikki variant beriladi.","l":"o","id":892,"t":1},{"c":"til","s":"r","q":"“Ota-bobolarimiz, momolarimiz bizga yoshligimizdanoq ozodalik, saranjom-sarishtalik, halollik va harom-harish haqida soʻzlab, pandu nasihatlar bilan ongimizga singdirishga uringanlar.”","a":"Xato yoʻq (0 ta).","i":"yoshligimizdanoq, halollik toʻgʻri.","l":"o","id":893,"t":1},{"c":"til","s":"r","q":"\"","a":"108–113 savol guruhi qismi (savol matni yoʻq); 113 parchasida 2 xato.","i":"Matn boʻsh.","l":"p","id":894,"t":0},{"c":"til","s":"r","q":"“Ustav” soʻzi qaysi soʻz bilan ma’nodosh boʻla oladi?","a":"Nizom.","i":"Ustav maʼnodoshi.","l":"y","id":895,"t":1},{"c":"til","s":"r","q":"“Rasmiy ishonchnomalar odatda yuqori statistika idorasi tasdiqlagan namunaviy shakldagi bosma ish qogʻozida rasmiylashtiriladi” Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim?","a":"2 oʻrinda: «…ishonchnomalar, odatda, yuqori…».","i":"«odatda» – kirish soʻz.","l":"y","id":896,"t":1},{"c":"til","s":"r","q":"“Ota-bobolarimiz, momolarimiz bizga yoshligimizdan-oq ozodalik, saranjom-sarishtalik, xalollik va harom-harish haqida soʻzlab, pandu nasihatlar bilan ongimizga singdirishga uringanlar.”\"","a":"2 ta: yoshligimizdan-oq→yoshligimizdanoq, xalollik→halollik.","i":"-oq qoʻshib yoziladi.","l":"o","id":897,"t":1},{"c":"til","s":"r","q":"Qaysi javobda “rezolyutsiya” soʻzi toʻgʻri izohlangan?","a":"Rezolyutsiya – rahbarning hujjat ijrosi boʻyicha yozma koʻrsatmasi (qarori).","i":"Hujjat rekviziti.","l":"y","id":898,"t":1},{"c":"til","s":"r","q":"Muhim hujjatlarda javobgar shaxslarning imzolari haqiqiyligini tasdiqlovchi zaruriy qism qanday nomlanadi?","a":"Muhr (gerbli muhr).","i":"Imzo haqiqiyligini tasdiqlaydi.","l":"y","id":899,"t":1},{"c":"til","s":"r","q":"“Ilm ze…nimizni, fikrimizni qilich kabi oʻtkir qiladi, savobni guno…dan, …alolni …aromdan ajratib beradi”.Berilgan parchada nechta soʻz tarkibida nuqtalar oʻrnida “h” qoʻllanadi?","a":"4 ta: zehn, gunoh, halol, harom.","i":"Hammasi h bilan.","l":"y","id":900,"t":1},{"c":"til","s":"r","q":"Qaysi gapda qoʻshimcha qoʻllash bilan bogʻliq uslubiy xatolik mavjud emas?","a":"Qoida: kelishik, egalik, -lar qoʻshimchalari toʻgʻri qoʻllangan gapni tanlang.","i":"Variantlarsiz.","l":"p","id":901,"t":0},{"c":"til","s":"r","q":"Tashkilot ma’lum bir shaxsni muvaqqat ishga yollash maqsadida qanday hujjat tuzadi?","a":"Mehnat shartnomasi (muddatli kontrakt).","i":"Muvaqqat ishga yollash.","l":"o","id":902,"t":1},{"c":"til","s":"r","q":"“Rasmiy shaxslarning ommaviy axborot vositalari vakillari bilan rasmiy nuqtayi nazar bildirish yoki muayyan masaladagi xulosalarni qisqacha bayon etish maqsadidagi uchrashuvi”. Ushbu izoh berilgan soʻzlardan qaysi biriga mos?","a":"Brifing.","i":"Rasmiy shaxslarning OAV bilan qisqa uchrashuvi.","l":"y","id":903,"t":1},{"c":"til","s":"r","q":"Yurtboshimiz oʻz nutqlarida Vatan ravnaqi yoʻlida har bir fuqaro mas’uldir degan edi\"","a":"Koʻchirma gap: …nutqlarida: «Vatan ravnaqi yoʻlida har bir fuqaro masʼul», – degan edi. Oʻzlashtirma koʻrinishida tinish belgisi shart emas.","i":"Savol matni yoʻq.","l":"p","id":904,"t":0},{"c":"til","s":"r","q":"Qaysi javobdagi birliklar boʻgʻinga koʻchirilmaydi?","a":"Qoida: bir boʻgʻinli soʻzlar, qisqartmalar, raqamli birliklar, initsial+familiya boʻgʻinga koʻchirilmaydi.","i":"Variantlarsiz.","l":"p","id":905,"t":0},{"c":"til","s":"r","q":"Qaysi gapda “qolmoq” fe’li duchor boʻlmoq, giriftor boʻlmoq ma’nosida qoʻllangan?","a":"Qoida: «Uyatga qoldi», «baloga qoldi» tipidagi gapni tanlang.","i":"qolmoq = duchor boʻlmoq.","l":"p","id":906,"t":0},{"c":"til","s":"r","q":"\"oбъект\" soʻzi lotin alifbosidagi imlo qoidalariga koʻra toʻgʻri yozilgan javobni belgilang.","a":"obyekt","i":"ъ belgisi tushiriladi.","l":"y","id":907,"t":1},{"c":"til","s":"r","q":"“Oʻzbek hujjatchiligining shakllantirish va takomillashtirishdagi eng muhim masalalardan biri hujjatlarning tili, uslubi masalasidir”. Ushbu gapda qanday xatolik uchraydi?","a":"Kelishik xatosi: «hujjatchiligini shakllantirish» boʻlishi kerak.","i":"-ning oʻrniga -ni.","l":"y","id":908,"t":1},{"c":"til","s":"r","q":"Qaysi soʻzda tutuq belgisi tushirilsa, ma’no oʻzgaradi?","a":"Qoida: sheʼr, taʼna, vaʼz, suʼrat, maʼno kabi tutuqsiz boshqa soʻz beradiganini tanlang.","i":"Variantlarsiz.","l":"p","id":909,"t":0},{"c":"til","s":"r","q":"“tushmoq” soʻzi qaysi javobda boʻshamoq ma’nosida qoʻllangan?","a":"Qoida: «Narx tushdi», «joy boʻshadi» – boʻshamoq maʼnosidagi «tushmoq» bor gapni tanlang.","i":"Varian ida qoʻllangan?","a":"Qoida: behuda – Quruq vaʼda; Quruq gap","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1035,"t":0},{"c":"til","s":"r","q":"Qaysi javobda nuqtalar oʻrniga “i” unlisi qoʻyiladi?","a":"Qoida: imlo lugʻati (masalan, tabiat, sharoit, mumkin)","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1036,"t":0},{"c":"til","s":"r","q":"Qaysi maqolda oʻzaro zid ma’noli soʻzlar ishtirok etgan?","a":"Qoida: zid maʼnoli soʻzlar (yaxshi–yomon, oz–koʻp, doʻst–dushman) bor maqolni tanlang","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1037,"t":0},{"c":"til","s":"r","q":"Ovozidan darrov tanidi // o’zining eski qadrdon do’sti Anvar ekan.\"","a":"Ikki nuqta: … tanidi: oʻzining …","i":"Ikkinchi qism birinchisini izohlaydi","l":"o","id":1038,"t":1},{"c":"til","s":"r","q":"Monograﬁya, dissertatsiya va avtoreferatlar qaysi uslubda yoziladi?","a":"Ilmiy uslub","i":"Ilmiy ishlar janrlari","l":"y","id":1039,"t":1},{"c":"til","s":"r","q":"Ariza va tushuntirish xatining oʻxshash jihati toʻgʻri koʻrsatilgan javobni belgilang.","a":"Ikkalasi shaxsiy hujjat: bir shaxs nomidan rahbarga yoziladi, zaruriy qismlari va shakli bir xil","i":"Ish yuritish qoidalari","l":"o","id":1040,"t":1},{"c":"til","s":"r","q":"\"Nashriyot xodimlar…(1) mehnat va turmush sharoitlari…(2) yaxshilab borishi, ular…(3) ijtimoiy va iqtisodiy manfaatlari…(4) himoya etishi, xodimlar…(5) malakasi…(6) oshirib borishi, mehnat muhofazasi me’yorlariga rioya etishi shart.","a":"-ning: 1, 3, 5; -ni: 2, 4, 6","i":"xodimlarning, sharoitlarini, ularning, manfaatlarini, xodimlarning, malakasini","l":"y","id":1041,"t":1},{"c":"til","s":"r","q":"Ushbu gapda qaysi oʻrinlarda -ning qoʻshimchasi qoʻllanadi?\"","a":"1-, 3-, 5-oʻrinlarda","i":"xodimlarning, ularning, xodimlarning","l":"y","id":1042,"t":1},{"c":"til","s":"r","q":"Ajratib yoziladigan soʻzlar berilgan javobni belgilang.","a":"Qoida: koʻmakchi fe'lli, ot+fe'l birikmalari (sarf etmoq, sotib olmoq), har kim, hech narsa ajratib yoziladi","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1043,"t":0},{"c":"til","s":"r","q":"Qaysi gapda tire va vergul qoʻllanishi lozim?","a":"Qoida: tire va vergul – koʻchirmadan keyin (”, – dedi) yoki ajratilgan izoh/ot kesimli boʻlaklarda","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1044,"t":0},{"c":"til","s":"r","q":"Qaysi javobdagi barcha soʻzlar oʻzaro sinonim (ma’nodosh) emas?","a":"Qoida: bir umumiy maʼnoga ega boʻlmagan soʻzlar qatorini tanlang","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1045,"t":0},{"c":"til","s":"r","q":"Berilgan gap rasmiy uslub talabiga koʻra toʻgʻri yakunlangan javobni belgilang. “Masala yuzasidan qabul qilingan qarordan norozi boʻlsangiz, ...”","a":"… yuqori turuvchi organga yoki sudga shikoyat qilishingiz mumkin.","i":"Rasmiy uslub","l":"o","id":1046,"t":1},{"c":"til","s":"r","q":"“bormoq” soʻzi qaysi javobda davom etmoq ma’nosida qoʻllangan?","a":"Qoida: davom etmoq – Suhbat uzoq bordi; Ish davom etib bormoqda","i":"Variantlarsiz aniqlab boʻlmaydi","l":"p","id":1047,"t":0},{"c":"til","s":"r","q":"Ushbu gap qaysi nutq uslubiga xosligini aniqlang. “Hoy, Adolat, oʻzizzi ja bilimdon sanavorasizki…Nima u yomon boʻlsin, deptimi?”","a":"Soʻzlashuv uslubi","i":"Sheva, qisqargan shakllar, murojaat","l":"y","id":1048,"t":1},{"c":"til","s":"r","q":"Ushbu parcha qaysi uslubga xosligini aniqlang. Elektr zaryadlari bir-biriga bevosita tegmasdan ham ta’sirlashadi. Ular oʻz atrofida elektr maydonni hosil qiladi.","a":"Ilmiy uslub","i":"Fizik hodisaning ilmiy taʼrifi","l":"y","id":1049,"t":1},{"c":"til","s":"r","q":"Hazrat Navoiy shunday yozadi Adab kichik yoshliklarni ulugʻlar duosiga sazovor etadi\"","a":"Hazrat Navoiy shunday yozadi: “Adab kichik yoshliklarni ulugʻlar duosiga sazovor etadi.”","i":"Koʻchirma oldidan ikki nuqta","l":"o","id":1050,"t":1},{"c":"til","s":"r","q":"Ola tovuq somon sochar, oz aybini oʻzi ochar. \"","a":"Vergul toʻgʻri; maʼnosi: aybdor oʻzini oʻzi fosh qiladi","i":"Savol matni toʻliq emas","l":"p","id":1051,"t":0},{"c":"til","s":"r","q":"\"Ushbu shartnoma ikki nusxada tuzilgan, … nusxasi – ma’muriyatda, … esa xodimda saqlanadi.","a":"bir … ikkinchisi","i":"bir nusxasi – maʼmuriyatda, ikkinchisi esa xodimda","l":"y","id":1052,"t":1},{"c":"til","s":"r","q":"Hujjatdan olingan ushbu parchada nuqtalar oʻrniga qaysi ketma-ketlikdagi soʻzlarni qoʻllash uslubiy jihatdan toʻgʻri hisoblanadi?\"","a":"bir; ikkinchisi","i":"Rasmiy uslubga mos","l":"y","id":1053,"t":1},{"c":"til","s":"r","q":"“yangidan/yangi, yildan/yilga, soppa/sogʻ, atir/gul”\"","a":"Chiziqcha bilan 3 ta: yangidan-yangi, yildan-yilga, soppa-sogʻ; atirgul qoʻshib","i":"Savol matni toʻliq emas","l":"o","id":1054,"t":1},{"c":"til","s":"r","q":"Ushbu parchadagi nechta soʻzda nuqtalar oʻrnida “x” undoshi yoziladi? “Vatanni …imoya qilganlar yurtning asl suyanch togʻidir. Avlodlar ularning nomini fa…r bilan tilga oladilar. Ularning qa…ramonliklariga i…los qiladilar, chunki ular Vatanga ru…i bilan qorishib ketganlar.”","a":"2 ta: faxr, ixlos","i":"himoya, qahramonlik, ruhi – h","l":"y","id":1055,"t":1},{"c":"til","s":"r","q":"“achchiq, kichik” soʻzlariga -gina qoʻshimchasi imlo qoidalariga koʻra toʻgʻri qoʻshilgan javobni belgilang.","a":"achchiqqina, kichikkina","i":"q-asos +qina, k-asos +kina","l":"y","id":1056,"t":1},{"c":"til","s":"r","q":"“Yoqilgʻi va …omashyo za…iralari real e…tiyojni …isobga olgan …olda qazib olinishi zarur”. Ushbu gapdagi nechta soʻzda nuqtalar oʻrniga “h” undoshi qoʻllanishi lozim?","a":"3 ta: ehtiyojni, hisobga, holda","i":"xomashyo, zaxira – x","l":"y","id":1057,"t":1},{"c":"til","s":"r","q":"Ushbu soʻzlardan nechtasida imloviy xatolik uchraydi? “Taxlit, toʻpalon, uvishmoq, uyquchi”","a":"2 ta: Taxlit→tahlit, toʻpalon→toʻpolon","i":"uvishmoq, uyquchi toʻgʻri","l":"o","id":1058,"t":1},{"c":"til","s":"r","q":"Ushbu gapda necha oʻrinda vergul qoʻyilishi lozim? “Individual buyruqlar biror xodim ishga qabul qilinganda yoki boʻshatilganda boshqa boʻlimga oʻtkazilganda shuningdek muayyan xodim mukofotlanganda mehnat ta’til
